# =============================================================================
# FROZEN CONTRACT FRAGMENT — Tasks / Clarifications / Digest / Notifications /
# Reminders domain of the Express + Mongoose reference server.
#
# OpenAPI 3.1 fragment. Contains `paths:` and `components.schemas:` only.
# Every schema name is prefixed `Task` or `Clar` so it cannot collide with the
# sibling fragments (auth, voice, documents, ...).
#
# `security: [{ bearerAuth: [] }]` references a securityScheme that is DEFINED
# IN THE SIBLING AUTH FRAGMENT (paths.auth.yaml). This file deliberately does
# not declare components.securitySchemes.
#
# SOURCE OF TRUTH
#   src/routes/me.tasks.ts             (25 operations)
#   src/routes/me.clarifications.ts    (4 operations)
#   src/routes/me.digest.ts            (1 operation)
#   src/routes/me.notifications.ts     (2 operations)
#   src/routes/me.reminders.ts         (1 operation)
#   src/modules/tasks/{taskQuery,taskCounts,bulkService,matterLocale,
#                      dailyDigest,translateQuota,semanticSearch,summarize,
#                      estimateBacklog}.ts
#   src/modules/tasks/categorize/{propose,apply,prompt}.ts
#   src/modules/tasks/translateMatters/{run,prompt}.ts
#   src/models/{Task,Clarification,Notification,TaskBulkOp,DailyDigest}.ts
#   src/lib/errors.ts, src/middleware/{auth,errorHandler,rateLimit}.ts
#
# 33 operations across 28 path items.
#
# EVERY response body in this file was verified against a live reference server
# (http://localhost:4100, local Mongo, NO Gemini key) unless a `description`
# explicitly says otherwise.
#
# -----------------------------------------------------------------------------
# GLOBAL INVARIANTS THE .NET PORT MUST REPRODUCE
# -----------------------------------------------------------------------------
#
# 1. ERROR ENVELOPE. Every error is `{"error":{"code","message"}}` with an
#    OPTIONAL `details` (present only when AppError.details !== undefined).
#    Produced by src/middleware/errorHandler.ts. No other top-level keys.
#
# 2. TWO DIFFERENT 400 SHAPES.
#    a) Routes that call `schema.safeParse()` throw AppError(400, <own code>,
#       <own message>, zodError.flatten()) →
#       details = {formErrors: string[], fieldErrors: {<field>: string[]}}
#    b) POST /me/notifications/read calls `schema.parse()` — the raw ZodError
#       escapes to errorHandler, which emits code `validation_error`, message
#       `Request validation failed`, and
#       details = [{path: "ids.0", message: "Expected string, received number"}]
#       This is the ONLY endpoint in this domain with shape (b).
#
# 3. MONGOOSE CastError ON AN ObjectId → 404 {"code":"not_found",
#    "message":"Not found"}. Most routes pre-validate the id with
#    Types.ObjectId.isValid and emit their own domain 404 first, so this is a
#    backstop, not the normal path.
#
# 4. Task toJSON TRANSFORM (src/models/Task.ts toTaskJSON):
#      `_id`  -> `id`   (string, dropped from output)
#      `__v`  -> deleted
#      `priorityRank` -> ADDED, derived: urgent=3 high=2 normal=1 low=0
#                        (unknown priority falls back to 1)
#      `userId` IS included in the payload (as a hex string).
#      Embedded subtasks get their OWN transform (toIdJSON): `_id`->`id`,
#      `__v` dropped, and NO priorityRank.
#      Absent optional fields are OMITTED, never emitted as null.
#      Key order as emitted by the reference server:
#        userId, title, domain, kind, status, priority, subtasks, tags,
#        dueAt, notes, sourceLocale, i18n, estimate, completedAt, snoozedUntil,
#        reminders, deletedAt, rescheduleCount, createdAt, updatedAt, id,
#        priorityRank
#      (JSON object key order is not contractual, but is recorded here because
#       byte-for-byte diffing of the reference server is the stated goal.)
#
# 5. i18n OVERLAY. Only TWO endpoints run presentMatter/presentMatters:
#      GET /me/tasks   and   GET /me/tasks/{id}
#    On those two the `i18n` key is ALWAYS stripped from the output (even when
#    no overlay applies), and when the reader's locale differs from
#    `sourceLocale` and `i18n[locale]` exists, `title` and `notes` are replaced
#    by the translated copies.
#    EVERY OTHER endpoint that returns a task (POST /me/tasks, PATCH
#    /me/tasks/{id}, the subtask routes, /restore, /trash, bulk `sample`,
#    search `matches[].task`) returns the RAW toJSON — `i18n` IS PRESENT and no
#    overlay is applied. Verified live.
#    KNOWN BUG, PART OF THE FROZEN CONTRACT: subtask text is NEVER translated.
#    presentMatter looks up `copy.subtasks[String(sub._id)]`, but toJSON has
#    already renamed `_id` to `id`, so the key is the literal string
#    "undefined" and the lookup always misses. Verified live: an Arabic subtask
#    with a matching `i18n.en.subtasks[<subId>]` entry stayed Arabic while the
#    title and notes were overlaid.
#    Reader locale = `User.locale` resolved by primary subtag against
#    ['en','ar'], defaulting to 'en' (src/modules/ai/userLocale.ts).
#
# 6. SOFT DELETE. Every read filters `deletedAt: {$exists: false}`. The only
#    hard delete in the domain is DELETE /me/tasks/trash.
#
# 7. LITERAL ROUTE SEGMENTS ARE REGISTERED BEFORE `/me/tasks/:id`. In
#    src/routes/me.tasks.ts the declaration order is:
#      GET  /me/tasks/counts            (line 181)
#      GET  /me/tasks/tags              (line 199)
#      GET  /me/tasks/categorize/pending(line 473)
#      GET  /me/tasks/trash             (line 515)
#      DELETE /me/tasks/trash           (line 528)
#      POST /me/tasks/:id/restore       (line 541)
#      GET  /me/tasks/:id               (line 561)   <-- catch-all
#      ...
#      DELETE /me/tasks/:id             (line 769)   <-- catch-all
#      GET  /me/tasks/translate/quota   (line 807)
#    The router MUST match `counts`, `tags`, `trash` before `:id` for GET, and
#    `trash` before `:id` for DELETE. `bulk`, `undo`, `search`, `summarize`,
#    `estimate-backlog`, `categorize`, `translate` are POST-only, so a GET to
#    them falls through to GET /me/tasks/{id} and, because they are not valid
#    ObjectIds, returns 404 `task_not_found`. Verified live:
#      GET /me/tasks/bulk    -> 404 {"code":"task_not_found"}
#      GET /me/tasks/search  -> 404 {"code":"task_not_found"}
#      DELETE /me/tasks/counts -> 404 {"code":"task_not_found"}
#      GET /me/tasks/undo/xyz -> 404 Express HTML "Cannot GET ..." (no route)
#    `/me/tasks/translate/quota` and `/me/tasks/categorize/pending` are two
#    segments deep, so they never collide with `/me/tasks/:id`.
#
# 8. RATE LIMITERS (src/middleware/rateLimit.ts). Hand-rolled in-memory sliding
#    window, keyed by `req.auth.sub` (the limiter runs AFTER requireAuth) and
#    falling back to `req.ip`. Entirely SKIPPED when NODE_ENV === 'test'.
#      taskSearchLimiter  — windowMs 60000, max 30. Used by /me/tasks/search.
#      taskSummaryLimiter — windowMs 60000, max 10. ONE SHARED BUCKET across
#        /me/tasks/summarize, /me/tasks/estimate-backlog, /me/tasks/categorize
#        and /me/tasks/translate (same middleware instance). Verified live:
#        10 calls to /summarize then /estimate-backlog, /categorize and
#        /translate all returned 429.
#      No other endpoint in this domain is rate limited.
#    On rejection: `Retry-After` header (integer seconds, >= 1, computed as
#    ceil((oldestHitInWindow + windowMs - now) / 1000)) and 429
#    {"error":{"code":"rate_limited","message":"You are going a little fast —
#    give it a moment and try again."}}  (note the U+2014 em dash).
#
# 9. `express.json({limit: '256kb'})`. A larger body produces a raw
#    express/body-parser error (not the AppError envelope).
#
# -----------------------------------------------------------------------------
# ERROR CODE INVENTORY FOR THIS DOMAIN (status · code · literal message)
# -----------------------------------------------------------------------------
# 400 invalid_query          "Invalid task list query."                        GET /me/tasks
# 400 invalid_query          "Invalid counts query."                           GET /me/tasks/counts
# 400 invalid_query          "Invalid digest query."                           GET /me/digest
# 400 invalid_body           "Invalid task payload."                           POST /me/tasks
# 400 invalid_body           "Invalid task update."                            PATCH /me/tasks/{id}
# 400 invalid_body           "Invalid subtask payload."                        POST /me/tasks/{id}/subtasks
# 400 invalid_body           "Invalid subtask update."                         PATCH /me/tasks/{id}/subtasks/{subId}
# 400 invalid_body           "Invalid bulk request."                           POST /me/tasks/bulk, /bulk/preview
# 400 invalid_body           "Invalid categorize request."                     POST /me/tasks/categorize
# 400 invalid_body           "Invalid apply request."                          POST /me/tasks/categorize/{id}/apply
# 400 invalid_body           "Invalid search request."                         POST /me/tasks/search
# 400 invalid_body           "Invalid summary range."                          POST /me/tasks/summarize
# 400 invalid_body           "Invalid backfill request."                       POST /me/tasks/estimate-backlog
# 400 invalid_body           "Invalid translate request."                      POST /me/tasks/translate
# 400 invalid_body           "Provide ids or a filter."                        bulkService.resolveTargets (unreachable via HTTP — the zod refine catches it first)
# 400 invalid_answer         "Invalid answer payload."                         POST /me/clarifications/{id}/resolve
# 400 invalid_option         "That answer is no longer available."             POST /me/clarifications/{id}/resolve
# 400 subtask_limit          "This task already has 50 subtasks — remove some before adding more."   POST /me/tasks/{id}/subtasks
# 400 bulk_too_large         "That matches more than 500 matters. Narrow the range and try again."   POST /me/tasks/bulk, DELETE /me/tasks/{id}
# 400 no_targets             "Nothing to categorise."                          POST /me/tasks/categorize  (AI-gated; unreachable while unconfigured)
# 400 categorize_too_many    "Categorising works on up to 80 matters at a time. Select fewer."       POST /me/tasks/categorize (AI-gated)
# 400 validation_error       "Request validation failed"                       POST /me/notifications/read  (ZodError shape)
# 401 missing_token          "Missing access token"                            every endpoint
# 401 invalid_token          "Invalid or expired access token"                 every endpoint
# 401 unauthorized           "Unauthorized"                                    defensive `if (!req.auth)` in every handler; unreachable behind requireAuth
# 402 quota_exceeded         "You've hit today's limit of {limit} {kind}s."    AI endpoints (AI-gated; unreachable while unconfigured)
# 402 translate_quota_exceeded "Your matters have already been translated into this language this month."  POST /me/tasks/translate (AI-gated)
# 404 task_not_found         "Task no longer exists."                          GET/PATCH/DELETE /me/tasks/{id}, /restore, subtask routes
# 404 subtask_not_found      "Subtask no longer exists."                       PATCH/DELETE /me/tasks/{id}/subtasks/{subId}
# 404 undo_not_found         "That change is no longer undoable."              POST /me/tasks/undo/{token}  — malformed token
# 404 undo_not_found         "That change is no longer undoable — undo is available for 30 days."     POST /me/tasks/undo/{token} — well-formed but unknown
# 404 proposal_not_found     "That suggestion has expired."                    POST /me/tasks/categorize/{id}/apply, /discard
# 404 clarification_not_found "That question is no longer here."               POST /me/clarifications/{id}/{resolve,defer,drop}
# 404 not_found              "Not found"                                       errorHandler CastError backstop
# 409 categorize_already_open "You already have suggestions waiting. Review those first."             POST /me/tasks/categorize (AI-gated)
# 429 rate_limited           "You are going a little fast — give it a moment and try again."
# 500 internal_error         "Internal server error"                           unhandled throw, incl. Mongoose ValidationError (see notes on POST /me/tasks and the subtask routes)
# 503 ai_not_configured      "Search by description is unavailable."           POST /me/tasks/search
# 503 ai_not_configured      "Summaries are unavailable right now."            POST /me/tasks/summarize
# 503 ai_not_configured      "Estimates are unavailable right now."            POST /me/tasks/estimate-backlog
# 503 ai_not_configured      "Categorising is unavailable right now."          POST /me/tasks/categorize
# 503 ai_not_configured      "Translating is unavailable right now."           POST /me/tasks/translate
# 503 ai_not_configured      "Typing your own answer needs AI configured. Pick one of the suggestions instead."
#                                                                              POST /me/clarifications/{id}/resolve  ({type:'custom'} only)
# =============================================================================

openapi: 3.1.0

paths:

  # ===========================================================================
  # /me/tasks
  # ===========================================================================
  /me/tasks:
    get:
      operationId: taskList
      summary: List matters
      tags: [tasks]
      security:
        - bearerAuth: []
      description: |
        The Matters list. No rate limiter.

        QUERY SCHEMA IS `.strict()`.
        `ListQuerySchema = TaskFilterSchema.extend({sort, limit, cursor}).strict()`
        — 17 recognised parameters (14 filters + sort + limit + cursor). ANY other
        query parameter is a 400 `invalid_query` with
        `details.formErrors = ["Unrecognized key(s) in object: 'bogus'"]`.
        Verified live: `GET /me/tasks?bogus=1` -> 400.

        EMPTY-STRING BEHAVIOUR IS PER-PARAMETER (all verified live against
        `?<param>=`):
          q                 -> 400 "String must contain at least 1 character(s)"
          status            -> 400 "must not be empty"
          domain            -> 400 "must not be empty"
          priority          -> 400 "must not be empty"
          kind              -> 400 "must not be empty"
          tag               -> 200 (empty string passes `z.string().max(400)`;
                                    splits to zero usable tags, so NO tag filter
                                    is applied)
          dueBefore         -> 400 "Invalid datetime"
          dueAfter          -> 400 "Invalid datetime"
          createdBefore     -> 400 "Invalid datetime"
          createdAfter      -> 400 "Invalid datetime"
          completedBefore   -> 400 "Invalid datetime"
          completedAfter    -> 400 "Invalid datetime"
          overdue           -> 400 "Invalid input"
          undated           -> 400 "Invalid input"
          untagged          -> 400 "Invalid input"
          sort              -> 400 "Invalid enum value. Expected 'due-asc' | 'due-desc' | 'created-desc' | 'created-asc' | 'priority-desc' | 'title-asc', received ''"
                               (the `.default()` only fires when the key is ABSENT)
          limit             -> 400 "Number must be greater than or equal to 1"
                               (z.coerce.number() turns "" into 0)
          cursor            -> 200 (empty string decodes to offset 0)

        OTHER PARSE EDGE CASES (verified live):
          `?status=open&status=done` (Express yields an array) -> 400
            fieldErrors.status = ["Expected string, received array"]
          `?q[a]=1` (Express yields an object) -> 400
            fieldErrors.q = ["Expected string, received object"]
          `?limit=abc` -> 400 "Expected number, received nan"
          `?limit=2.5` -> 400 "Expected integer, received float"
          `?limit=0`   -> 400 "Number must be greater than or equal to 1"
          `?limit=201` -> 400 "Number must be less than or equal to 200"
          `?q=<201 chars>` -> 400 "String must contain at most 200 character(s)"
          `?cursor=<65 chars>` -> 400 "String must contain at most 64 character(s)"
          `?status=open,bogus` -> 400
            fieldErrors.status = ["expected one of open|done|snoozed, got \"bogus\""]

        FILTER SEMANTICS (src/modules/tasks/taskQuery.ts buildTaskFilter):
          - Base filter is always `{userId, deletedAt: {$exists: false}}`.
          - `q` becomes a case-insensitive RegExp (input regex-escaped) applied
            as `$or: [{title: rx}, {notes: rx}]`. Canonical text only — never
            the i18n copies.
          - status/domain/priority/kind are `$in` over the CSV members (values
            are `.trim()`ed, empties dropped).
          - `tag` is split on commas, each part run through normalizeTag
            (trim, lowercase, whitespace->'-', strip non `[a-z0-9-]`, collapse
            runs of '-', trim leading/trailing '-', truncate to 32 chars); the
            surviving tags become `tags: {$in: [...]}` (OR). If nothing
            survives, no tag clause is added.
          - `untagged=true` sets `tags: {$size: 0}` and OVERWRITES any `tag`
            clause (it is assigned after it).
          - dueBefore -> `dueAt.$lte`; dueAfter -> `dueAt.$gte`.
          - `overdue=true` sets `dueAt.$lt = min(dueBefore, now)` (and deletes
            the `$lte`), and — ONLY when `status` was not supplied — forces
            `status: {$in: ['open','snoozed']}`.
          - `undated=true` sets `dueAt: {$exists: false}` and DISCARDS the whole
            dueBefore/dueAfter/overdue clause.
          - createdBefore/After -> `createdAt.$lte/$gte`;
            completedBefore/After -> `completedAt.$lte/$gte`.

        SORTING. Executed as an aggregation with
        `collation({locale:'en', strength:2})` (case-insensitive, applies to
        `title-asc`). Two synthetic fields are added then `$unset`:
          `_dueSort` = `dueAt ?? sentinel` where sentinel is
            8640000000000000ms (max Date) for every sort EXCEPT `due-desc`,
            which uses -8640000000000000ms — so undated matters always sort LAST.
          `_priSort` = 3/2/1/0 for urgent/high/normal/low (default 1).
        The six sorts map to:
          due-asc       (DEFAULT) -> {_dueSort: 1, createdAt: -1}
          due-desc                -> {_dueSort: -1, createdAt: -1}
          created-desc            -> {createdAt: -1}
          created-asc             -> {createdAt: 1}
          priority-desc           -> {_priSort: -1, _dueSort: 1}
          title-asc               -> {title: 1}

        PAGINATION. `cursor` is an OFFSET encoded as base64url of the decimal
        offset with NO padding: `Buffer.from(String(offset)).toString('base64url')`.
        Examples verified live: offset 2 -> "Mg", offset 4 -> "NA".
        Decoding is forgiving: a value that does not decode to a finite integer
        >= 0 yields offset 0 (verified live with `?cursor=%%%%` -> page 1, 200).
        `total` is the count of ALL matching rows (single `$facet`, so header
        and rows can never disagree). `nextCursor` is
        `encodeCursor(offset + rows.length)` when `offset + rows.length < total`,
        otherwise `null`.

        RESPONSE POST-PROCESSING. Each row is `toJSON()`ed then passed through
        `presentMatters(rows, userLocale)` — i18n overlay applied, `i18n` key
        stripped. See global invariant 5.
      parameters:
        - { $ref: '#/components/parameters/TaskQ' }
        - { $ref: '#/components/parameters/TaskStatusCsv' }
        - { $ref: '#/components/parameters/TaskDomainCsv' }
        - { $ref: '#/components/parameters/TaskPriorityCsv' }
        - { $ref: '#/components/parameters/TaskKindCsv' }
        - { $ref: '#/components/parameters/TaskTagCsv' }
        - { $ref: '#/components/parameters/TaskDueBefore' }
        - { $ref: '#/components/parameters/TaskDueAfter' }
        - { $ref: '#/components/parameters/TaskCreatedBefore' }
        - { $ref: '#/components/parameters/TaskCreatedAfter' }
        - { $ref: '#/components/parameters/TaskCompletedBefore' }
        - { $ref: '#/components/parameters/TaskCompletedAfter' }
        - { $ref: '#/components/parameters/TaskOverdue' }
        - { $ref: '#/components/parameters/TaskUndated' }
        - { $ref: '#/components/parameters/TaskUntagged' }
        - { $ref: '#/components/parameters/TaskSortParam' }
        - { $ref: '#/components/parameters/TaskLimitParam' }
        - { $ref: '#/components/parameters/TaskCursorParam' }
      responses:
        '200':
          description: |
            Verified live (empty account): `{"tasks":[],"total":0,"nextCursor":null}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '400':
          description: '`invalid_query` — unknown parameter, or any field that failed the zod schema.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
              examples:
                unknownKey:
                  value:
                    error:
                      code: invalid_query
                      message: Invalid task list query.
                      details:
                        formErrors: ["Unrecognized key(s) in object: 'bogus'"]
                        fieldErrors: {}
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

    post:
      operationId: taskCreate
      summary: Create a matter
      tags: [tasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Body schema is `.strict()` (`CreateTaskSchema`).

        SERVER-SIDE DERIVATIONS applied at create:
          - `kind` defaults to `'reminder'` when `dueAt` was supplied, else
            `'list'`.
          - `priority` defaults to `'normal'`.
          - `tags` defaults to `[]`.
          - `status` is always forced to `'open'` (not accepted from the client).
          - `title` is `.trim()`ed by zod before storage.
          - `tags` are normalized (see normalizeTag under GET /me/tasks),
            de-duplicated in order, empties dropped, and truncated to the first
            10 survivors. Input array may hold up to 20 entries (MAX_TAGS * 2),
            each at most 64 chars; over that is a 400.
            Verified live: `["Car Insurance","car insurance","  ","x!!y"]`
            -> `["car-insurance","xy"]`.
          - `estimate` is snapped onto the bucket ladder
            [5,10,15,30,45,60,90,120,180,240] (nearest bucket; ties go to the
            LARGER bucket; anything <= 5 becomes 5; anything above 240 becomes
            240), min/max are re-sorted so max >= min, and `source` is stamped
            `'user'`. Verified live: `{minMinutes:23,maxMinutes:7}` ->
            `{minMinutes:5,maxMinutes:30,source:"user"}`.
          - `sourceLocale` is NOT set by this route (absent in the response).

        KNOWN 500, PART OF THE FROZEN CONTRACT: `{"kind":"reminder"}` with no
        `dueAt` passes zod but fails the Mongoose `pre('validate')` reminder
        invariant. The ValidationError is not mapped by errorHandler, so the
        response is 500 `internal_error`. Verified live.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '201':
          description: |
            Verified live:
            {"task":{"userId":"6a78bb51aa461ae1dc64a031","title":"Renew passport",
            "domain":"home","kind":"list","status":"open","priority":"normal",
            "tags":[],"rescheduleCount":0,"subtasks":[],"reminders":[],
            "createdAt":"2026-08-09T17:42:21.794Z","updatedAt":"2026-08-09T17:42:21.794Z",
            "id":"6a78bbfdaa461ae1dc64a10e","priorityRank":1}}
            RAW toJSON — no i18n overlay, `i18n` NOT stripped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '400':
          description: '`invalid_body` / "Invalid task payload."'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500':
          description: |
            `internal_error`. Reachable deterministically with
            `{"title":"x","domain":"home","kind":"reminder"}` (reminder without
            dueAt → Mongoose ValidationError). Verified live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }

  # ===========================================================================
  /me/tasks/counts:
    get:
      operationId: taskCounts
      summary: Bucket counts for the Matters header and dashboard
      tags: [tasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Query schema `z.object({tz: z.string().max(64).optional()}).strict()`.
        Unknown parameter -> 400 `invalid_query` / "Invalid counts query."
        Verified live.

        `tz` is an IANA zone used for local-day boundaries. It is NOT validated
        here beyond its length; an unparsable zone makes `zoneOffsetMinutes`
        fall back to offset 0 (UTC).

        Boundary definitions (src/modules/tasks/taskQuery.dayBoundaries):
          todayStart = local midnight, expressed as a UTC instant
          tomorrowStart = todayStart + 1d
          dayAfterTomorrowStart = todayStart + 2d
          weekEnd = todayStart + 7d   ("this week" is the next 7 days, NOT the
                                       calendar week)

        Bucket definitions. `live` means
        `{userId, deletedAt:{$exists:false}, status:{$in:['open','snoozed']}}`:
          overdue        live && dueAt <  now
          today          live && now <= dueAt < tomorrowStart   (NOTE: lower
                         bound is `now`, not todayStart — earlier-today items
                         are counted as `overdue`, not `today`)
          tomorrow       live && tomorrowStart <= dueAt < dayAfterTomorrowStart
          thisWeek       live && dayAfterTomorrowStart <= dueAt < weekEnd
          later          live && dueAt >= weekEnd
          undated        live && dueAt missing
          open           {userId, not deleted, status:'open'}
          done           {userId, not deleted, status:'done'}
          trashed        {userId, deletedAt:{$exists:true}}  (separate query)
          slipping       live && (rescheduleCount >= 3 || dueAt < todayStart-14d)
          completedToday {userId, status:'done',
                          todayStart <= completedAt < tomorrowStart}
                         (the facet re-states userId but inherits the outer
                          `$match: {userId, deletedAt:{$exists:false}}`, so
                          soft-deleted rows are excluded here too)
          needsInput     Clarification.countDocuments({userId, status:'open',
                          $or:[{deferredUntil missing},{deferredUntil <= now}]})
          scansAwaitingReview  ScannedDocument.countDocuments({userId,
                          status:'ready_for_review', reviewedAt missing})
          byDomain / byPriority  `$group` over `live`; keys with a falsy _id are
                         dropped, and buckets with zero rows are ABSENT from
                         the object (it is not pre-seeded with all six domains
                         / four priorities).

        Verified live:
        {"counts":{"overdue":0,"today":0,"tomorrow":0,"thisWeek":0,"later":0,
        "undated":2,"open":2,"done":0,"trashed":0,"slipping":0,
        "completedToday":0,"needsInput":0,"scansAwaitingReview":0,
        "byDomain":{"home":1,"car":1},"byPriority":{"urgent":1,"normal":1}}}
      parameters:
        - name: tz
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
          description: IANA timezone, e.g. `Africa/Cairo`. Max 64 chars.
      responses:
        '200':
          content:
            application/json:
