  /me/tasks/translate/quota:
    get:
      operationId: taskTranslateQuota
      summary: Backlog-translation allowance and selection sizes
      tags: [tasks, ai]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, NO AI gate — this endpoint works on the parity server.

        `locale` query parameter is NOT schema-validated. It is passed through
        `resolveAiLocale`: the primary subtag is lowercased and matched against
        ['en','ar']; anything else (including absent) becomes `'en'`. So there
        is NO 400 from this route. Verified live: no parameter -> `locale:"en"`;
        `?locale=ar` -> `locale:"ar"`.

        `quota.limit` is always 1 (`TRANSLATE_RUNS_PER_MONTH`, all tiers).
        `resetAt` is midnight UTC on the 1st of the following month, derived
        from the `YYYY-MM` UTC bucket.

        `counts` are `countTranslatable` for the three presets against the SAME
        locale — live (`status in [open, snoozed]`, not deleted) matters whose
        resolved source locale differs from the target and which have no
        `i18n[target]` copy yet:
          thisWeek  = dueAt <= now + 7 days
          thisMonth = dueAt <= now + 1 month (UTC month arithmetic)
          all       = no date bound
        `max` is the constant 150 (`MAX_TRANSLATE_TARGETS`).

        Verified live:
        {"quota":{"locale":"ar","limit":1,"used":0,"remaining":1,
        "resetAt":"2026-09-01T00:00:00.000Z"},
        "counts":{"thisWeek":0,"thisMonth":0,"all":7},"max":150}
      parameters:
        - name: locale
          in: query
          required: false
          schema: { type: string }
          description: |
            Target locale. Unvalidated; resolved to `en` or `ar`, defaulting to
            `en`. Never produces a 400.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTranslateQuotaResponse' }
          description: Quota status, per-preset counts, and the per-run cap.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/translate:
    post:
      operationId: taskTranslate
      summary: One-off sweep translating the backlog (AI-backed)
      tags: [tasks, ai]
      security:
        - bearerAuth: []
      description: |
        RATE LIMITER: `taskSummaryLimiter` (60000 ms / 10, SHARED).

        Body parsed from `req.body ?? {}`. Schema is NOT `.strict()` — unknown
        keys are accepted and stripped.
          locale  REQUIRED, enum ['en','ar']
          ids     optional, string[] (NOT validated as ObjectIds), max 150
          preset  optional, enum ['thisWeek','thisMonth','all']
        If both `ids` and `preset` are omitted the selection filter matches
        every live matter with no date bound and no id bound.

        ORDER: validate (400) BEFORE the AI gate (503) BEFORE
        `admitTranslateRun` (402). Verified live: `{"locale":"fr"}` -> 400
        `invalid_body` with
        `fieldErrors.locale = ["Invalid enum value. Expected 'en' | 'ar', received 'fr'"]`.

        CURRENT PARITY TARGET: 503 `ai_not_configured` /
        "Translating is unavailable right now." Verified live.

        QUOTA (AI-enabled only): one run per (user, target locale, UTC month).
        The month is CLAIMED BEFORE the run. It is handed back ONLY when the run
        threw, or when `translated === 0`. It is NEVER refunded on undo. When
        already spent: 402 `translate_quota_exceeded` /
        "Your matters have already been translated into this language this month."
        with `details: {locale, limit: 1, used: 1, resetAt}`.

        SUCCESS SHAPE (AI-enabled only):
        `{translated: <int>, skipped: <int>, failed: <int>}`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskTranslateRequest' }
      responses:
        '200':
          description: AI-enabled only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskTranslateResponse' }
        '400':
          description: '`invalid_body` / "Invalid translate request." Verified live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '402':
          description: '`translate_quota_exceeded`. Unreachable while AI is unconfigured.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '429': { $ref: '#/components/responses/TaskRateLimited' }
        '503':
          description: |
            CURRENT PARITY TARGET. Verified live:
            {"error":{"code":"ai_not_configured","message":"Translating is unavailable right now."}}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '500': { $ref: '#/components/responses/TaskInternal' }

