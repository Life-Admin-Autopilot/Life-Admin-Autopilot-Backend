  # ===========================================================================
  /me/tasks/bulk/preview:
    post:
      operationId: taskBulkPreview
      summary: Dry-run a bulk operation
      tags: [tasks, bulk]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Body = `z.intersection(BulkTargetSchema, BulkActionSchema)`.
        Neither half is `.strict()`, so UNKNOWN KEYS ARE ACCEPTED AND STRIPPED
        (this is how `label` rides along on POST /me/tasks/bulk).

        Target: exactly ONE of `ids` or `filter`
        (`.refine(v => Boolean(v.ids) !== Boolean(v.filter))`; failing it
        produces `details.formErrors = ["provide exactly one of ids or filter"]`).
        Verified live for both "neither" and "both".

        PREVIEW WRITES NOTHING and does NOT enforce the 500 cap — it is the
        endpoint that TELLS you about it. `resolveTargets` for a filter runs
        `.limit(501)`, so `count` saturates at 501 and
        `warnings.truncated = count > 500`.
        Verified live with 501 matching matters:
        `{"count":501,"warnings":{"fromDocuments":0,"remindersFired":0,"truncated":true},"sample":[... 50 items ...]}`

        `sample` is the FIRST 50 resolved tasks as RAW `toJSON()` — i18n present,
        no overlay (verified live).

        Warnings:
          fromDocuments  = number of resolved tasks with a `sourceDocumentId`
          remindersFired = number with at least one `reminders[].firedAt` set
          truncated      = resolved.length > 500
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskBulkRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskBulkPreviewResponse' }
          description: Resolved count, ripple warnings, and up to 50 sample matters.
        '400':
          description: '`invalid_body` / "Invalid bulk request."'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
              examples:
                bothTargets:
                  value:
                    error:
                      code: invalid_body
                      message: Invalid bulk request.
                      details:
                        formErrors: ['provide exactly one of ids or filter']
                        fieldErrors: {}
                badAction:
                  value:
                    error:
                      code: invalid_body
                      message: Invalid bulk request.
                      details:
                        formErrors: []
                        fieldErrors:
                          action: ["Invalid discriminator value. Expected 'delete' | 'complete' | 'snooze' | 'setDomain' | 'addTags'"]
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/bulk:
    post:
      operationId: taskBulkApply
      summary: Apply a bulk operation
      tags: [tasks, bulk]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Same body as /me/tasks/bulk/preview, PLUS an optional
        top-level `label` read directly off `req.body` (NOT part of the zod
        schema): `typeof req.body?.label === 'string' ? req.body.label.slice(0,240) : undefined`.
        The label is stored on the TaskBulkOp and never returned by this route.

        THE 500-TARGET CAP. `applyBulk` resolves targets (filter path
        `.limit(501)`), computes warnings, and if `warnings.truncated` throws
        400 `bulk_too_large` with the literal message
        "That matches more than 500 matters. Narrow the range and try again."
        Verified live against 501 matching matters.
        An explicit `ids` array is additionally capped by zod at 500 entries
        (`"Array must contain at most 500 element(s)"`) and requires at least 1
        (`"Array must contain at least 1 element(s)"`). Both verified live.

        PER-ACTION EFFECT and the recorded undo patch (`prior` -> `next`):
          delete    prior {deletedAt: null}                    next {deletedAt: now}
                    (`null` in `prior` means "$unset on undo")
          complete  SKIPPED when status already 'done'.
                    prior {status, completedAt: <old|null>}    next {status:'done', completedAt: now}
          snooze    never skipped.
                    prior {status, snoozedUntil: <old|null>}   next {status:'snoozed', snoozedUntil: new Date(until)}
          setDomain SKIPPED when the domain already matches.
                    prior {domain}                             next {domain}
          addTags   tags normalized, unioned with existing, truncated to 10.
                    SKIPPED when nothing new would be added.
                    prior {tags: [...old]}                     next {tags: merged}

        Skipped tasks are NOT recorded, so `affected` counts only real changes.
        When `affected === 0` NO TaskBulkOp is written and `undoToken` is
        `null`. Verified live: re-running `complete` over the same set returned
        `{"affected":0,"undoToken":null,"warnings":{...}}`.

        The TaskBulkOp is written BEFORE the `Task.bulkWrite`, so a partial
        failure is still fully undoable. `undoToken` is the op's `_id` as a hex
        string. TTL 30 days (`expiresAt`, Mongo TTL index).

        SIDE EFFECT ON `delete`: `dropClarificationsForTasks` marks every OPEN
        clarification whose `taskId` is in the affected set as `dropped` with a
        `resolvedAt`. THIS IS NOT REVERSED BY UNDO — see POST /me/tasks/undo/{token}.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskBulkApplyRequest' }
      responses:
        '200':
          description: |
            Verified live:
            `{"affected":5,"undoToken":"6a78bc60aa461ae1dc64a205","warnings":{"fromDocuments":0,"remindersFired":0,"truncated":false}}`
            and the no-op case
            `{"affected":0,"undoToken":null,"warnings":{"fromDocuments":0,"remindersFired":0,"truncated":false}}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskBulkResult' }
        '400':
          description: '`invalid_body` / "Invalid bulk request." or `bulk_too_large`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
              examples:
                tooLarge:
                  value:
                    error:
                      code: bulk_too_large
                      message: That matches more than 500 matters. Narrow the range and try again.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/undo/{token}:
    post:
      operationId: taskUndo
      summary: Reverse a bulk operation
      tags: [tasks, bulk]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no request body (any body is ignored).

        `token` is the TaskBulkOp `_id`. A token that is not a valid ObjectId
        yields 404 `undo_not_found` with the SHORT message; a well-formed but
        unknown/other-user token yields 404 `undo_not_found` with the LONG
        message. Both verified live — the two messages are different strings and
        must be reproduced exactly:
          malformed : "That change is no longer undoable."
          not found : "That change is no longer undoable — undo is available for 30 days."
        (em dash U+2014; the "30" is `BULK_OP_TTL_DAYS`.)

        IDEMPOTENT: if the op's status is not `applied` (already `undone`,
        `proposed` or `discarded`), the response is `{"restored":0}` with 200 —
        never an error. Verified live (second undo returned `{"restored":0}`).

        On success `entries[].prior` is replayed through the same
        `$set`/`$unset` split used to apply it (`null` -> `$unset`), the op is
        flipped to `undone` with an `undoneAt`, and `restored` is
        `op.entries.length` — the number of RECORDED entries, which may exceed
        the number of documents actually modified if some were hard-deleted in
        the meantime.

        UNDO DOES NOT UN-DROP CLARIFICATIONS. Verified live end-to-end: created
        a task with an open clarification, `DELETE /me/tasks/{id}` (the
        clarification flipped to `dropped` with a `resolvedAt`), then
        `POST /me/tasks/undo/{token}` -> `{"restored":1}`; the task came back
        out of the trash but `GET /me/clarifications` still did not list it and
        the row remained `status: "dropped"`.

        This route also undoes an APPLIED categorize op (same record type).
        Verified live.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: TaskBulkOp id (24-char hex). Anything else -> 404 with the short message.
      responses:
        '200':
          description: '`{"restored": <int>}`. Verified live: 5, then 0 on a repeat.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskUndoResponse' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404':
          description: '`undo_not_found` — two distinct messages, see the operation description.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
              examples:
                malformedToken:
                  value:
                    error: { code: undo_not_found, message: That change is no longer undoable. }
                unknownToken:
                  value:
                    error:
                      code: undo_not_found
                      message: "That change is no longer undoable — undo is available for 30 days."
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/categorize:
    post:
      operationId: taskCategorizePropose
      summary: Propose a refiling of matters (AI-backed, writes nothing)
      tags: [tasks, ai, bulk]
      security:
        - bearerAuth: []
      description: |
        RATE LIMITER: `taskSummaryLimiter` (60000 ms / 10, SHARED).

        Body is `BulkTargetSchema` ONLY (no `action`), parsed from
        `req.body ?? {}` so an absent body is allowed but then fails the
        exactly-one-of refine.

        ORDER OF CHECKS:
          1. requireAuth  2. rate limiter
          3. `BulkTargetSchema.safeParse` -> 400 `invalid_body` /
             "Invalid categorize request."  (verified live with `{}`)
          4. `isAiConfigured()` -> 503 `ai_not_configured` /
             "Categorising is unavailable right now."  (verified live)
          5. `getPendingProposal` -> 409 `categorize_already_open` /
             "You already have suggestions waiting. Review those first."
             with `details: {opId: "<hex>"}`
          6. quota -> 402  7. `proposeCategorization`

        Because the 503 is step 4 and the 409 is step 5, THE 409 IS UNREACHABLE
        ON THE CURRENT PARITY SERVER. Confirmed live: with a `proposed`
        TaskBulkOp seeded in the database, the request still answered with the
        AI gate (and, once the shared bucket was exhausted, 429).

        SUCCESS SHAPE (AI-enabled only): `{opId, changes[], unchanged}`.
        Selection cap is 80 (`MAX_CATEGORIZE_TARGETS`) — over it, 400
        `categorize_too_many`; zero targets -> 400 `no_targets` /
        "Nothing to categorise.". When the model proposes no change at all the
        response is `{"opId":"","changes":[],"unchanged":<n>}` (empty-string
        opId, no op record written, quota refunded).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskBulkTarget' }
      responses:
        '200':
          description: AI-enabled only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskProposalResult' }
        '400':
          description: '`invalid_body` / "Invalid categorize request.", or (AI-enabled) `no_targets` / `categorize_too_many`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '402':
          description: '`quota_exceeded`. Unreachable while AI is unconfigured.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '409':
          description: |
            `categorize_already_open` with `details.opId`. Unreachable while AI
            is unconfigured (the 503 check precedes it).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
              example:
                error:
                  code: categorize_already_open
                  message: You already have suggestions waiting. Review those first.
                  details: { opId: 6a78bd99deffe32875b01e66 }
        '429': { $ref: '#/components/responses/TaskRateLimited' }
        '503':
          description: |
            CURRENT PARITY TARGET. Verified live:
            {"error":{"code":"ai_not_configured","message":"Categorising is unavailable right now."}}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/categorize/pending:
    get:
      operationId: taskCategorizePending
      summary: The user's one open categorize proposal
      tags: [tasks, bulk]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no AI gate, no query schema. Reads
        `TaskBulkOp.findOne({userId, kind:'categorize', status:'proposed'})`.

        `null` when there is none — verified live: `{"proposal":null}`.

        When one exists, titles are joined back from the live Task collection
        (entries whose task has since been deleted/trashed are DROPPED from
        `changes`), `toDomain` falls back to the task's current domain when the
        entry has no `next.domain`, `addedTags` is
        `next.tags - task.tags`, `confidence` defaults to `'low'` and `reason`
        defaults to `''`.
        Verified live against a seeded proposal:
        {"proposal":{"opId":"6a78bd99deffe32875b01e66","changes":[{"taskId":"...",
        "title":"Renew passport","fromDomain":"family","toDomain":"finance",
        "addedTags":["passport"],"confidence":"high","reason":"It is a travel document"}],
        "createdAt":"2026-08-09T17:49:13.742Z"}}
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCategorizePendingResponse' }
          description: The open proposal, or null.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/categorize/{id}/apply:
    post:
      operationId: taskCategorizeApply
      summary: Commit the accepted subset of a proposal
      tags: [tasks, bulk]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no AI gate — this route is fully usable on the parity
        server. Body parsed from `req.body ?? {}`; schema is `.strict()`:
        `{taskIds: string[]}` where every entry must be a valid ObjectId and the
        array holds at most 80 entries. `taskIds` is REQUIRED (there is no
        `.optional()`), but may be an empty array.
        Verified live: 81 entries -> 400 `invalid_body` /
        `fieldErrors.taskIds = ["Array must contain at most 80 element(s)"]`.

        An `id` that is not a valid ObjectId, or an op that is not
        `{userId, kind:'categorize', status:'proposed'}`, yields 404
        `proposal_not_found` / "That suggestion has expired." Verified live for
        both `zzz` and a well-formed-but-unknown id.

        EMPTY ACCEPTED SET: the op is flipped to `discarded` and the response is
        `{"applied":0,"undoToken":null}` with 200. Verified live.

        NON-EMPTY: `entries` is NARROWED to the accepted ids (so undo can never
        touch a rejected row), status becomes `applied`, `appliedAt` is stamped,
        and the writes run with `{ordered: false}` re-asserting the not-deleted
        filter. Response `{"applied":<kept>, "undoToken":"<opId>"}` — the undo
        token IS the proposal id. Verified live: `{"applied":1,"undoToken":"6a78bdb08601b7b1a8a6eaf1"}`
        followed by `POST /me/tasks/undo/<that id>` -> `{"restored":1}`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The proposal (TaskBulkOp) id.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCategorizeApplyRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCategorizeApplyResponse' }
          description: Number applied and the undo token (null when nothing was kept).
        '400':
          description: '`invalid_body` / "Invalid apply request."'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404':
          description: '`proposal_not_found` / "That suggestion has expired."'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/categorize/{id}/discard:
    post:
      operationId: taskCategorizeDiscard
      summary: Throw away an open proposal
      tags: [tasks, bulk]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no AI gate, no request body. Flips the op to
        `discarded`. Responds `204 No Content` with an EMPTY body
        (`res.status(204).end()`). Verified live.
        Same 404 `proposal_not_found` rules as /apply.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Discarded. Empty body, no Content-Type. Verified live.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404':
          description: '`proposal_not_found` / "That suggestion has expired." Verified live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '500': { $ref: '#/components/responses/TaskInternal' }

