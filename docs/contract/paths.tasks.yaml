  # ===========================================================================
  /me/tasks/{id}:
    get:
      operationId: taskGet
      summary: One matter
      tags: [tasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. `Task.findOne({_id, userId, deletedAt:{$exists:false}})`.
        Malformed id, unknown id, other user's id, or a soft-deleted task all
        yield 404 `task_not_found` / "Task no longer exists." (verified live for
        all four).
        THIS IS ONE OF THE TWO ENDPOINTS THAT APPLY THE i18n OVERLAY
        (`presentMatter`) and strip `i18n`. Verified live: an `ar`-source matter
        with an `i18n.en` copy came back with the English title and notes, the
        Arabic SUBTASK TEXT UNCHANGED (see global invariant 5), `sourceLocale`
        still present, and no `i18n` key.
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
          description: The matter, with the i18n overlay applied and `i18n` stripped.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '500': { $ref: '#/components/responses/TaskInternal' }

    patch:
      operationId: taskUpdate
      summary: Partial update of a matter
      tags: [tasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Body schema `UpdateTaskSchema` is `.strict()`; every
        field is optional and SIX of them are explicitly nullable.

        NULL-VS-OMITTED SEMANTICS (the core of this route, all verified live):
          - A key present with `null` -> `$unset` (the field is CLEARED and
            disappears from the response).
              Nullable keys: `dueAt`, `notes`, `estimate`, `snoozedUntil`.
          - A key present with a value -> `$set`.
          - A key OMITTED -> untouched.
          - `title`, `domain`, `status`, `priority`, `tags` are NOT nullable;
            sending `null` is a 400.
          - An EMPTY body `{}` is valid: it produces `findOneAndUpdate(filter,
            {})`, which still bumps `updatedAt` and returns the task with 200.
            Verified live.

        COMPLETION STAMP: when `status === 'done'` the server sets
        `completedAt = new Date()`. When `status` is present and is ANYTHING
        ELSE ('open' or 'snoozed'), `completedAt` is `$unset`. When `status` is
        omitted, `completedAt` is left alone. Verified live in both directions.

        rescheduleCount: `$inc` by 1 ONLY when the parsed `dueAt` is a Date AND
        the existing document already had a `dueAt` AND the new value is
        STRICTLY LATER (`nextDue > existing.dueAt`). Verified live:
          later    -> rescheduleCount 0 -> 1
          earlier  -> unchanged
          identical-> unchanged
        Pulling a date onto a previously-undated task does NOT increment (there
        is no `existing.dueAt`), and `dueAt: null` never increments.

        Tag normalization is identical to POST /me/tasks (normalize, dedupe,
        cap at 10). `estimate` is snapped to the bucket ladder and stamped
        `source: 'user'`.

        THE ROUTE USES `findOneAndUpdate`, SO MONGOOSE DOCUMENT VALIDATORS DO
        NOT RUN. Consequence, verified live and part of the frozen contract:
        `PATCH {"dueAt": null}` on a `kind: "reminder"` task SUCCEEDS and leaves
        a reminder with no dueAt — a state the create path rejects with a 500.
        Any later `save()`-based route on that document (the three subtask
        routes) then fails with 500 `internal_error`. Verified live.

        Response is the RAW `toJSON()` of the updated document (`{new: true}`):
        i18n present, NO overlay. Verified live.

        A malformed id or an unknown/deleted/other-user id -> 404
        `task_not_found`.
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
          description: The updated matter, raw toJSON.
        '400':
          description: '`invalid_body` / "Invalid task update."'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '500': { $ref: '#/components/responses/TaskInternal' }

    delete:
      operationId: taskSoftDelete
      summary: Soft-delete a matter (returns an undo token)
      tags: [tasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no body. Routed through the SAME bulk service as a
        range delete: `applyBulk(userId, {ids: [id]}, {action: 'delete'})`, so a
        single swipe-delete produces exactly one TaskBulkOp and therefore the
        same one-tap undo.

        Response is ONLY `{"undoToken": "<opId>"}` — the deleted task is NOT
        echoed. Verified live: `{"undoToken":"6a78bc71aa461ae1dc64a227"}`.

        When `applyBulk` reports `affected === 0` (unknown id, already deleted,
        other user) the route throws 404 `task_not_found` / "Task no longer
        exists." — so a second DELETE of the same id is a 404, not a 200.
        Verified live. A malformed id short-circuits to the same 404.

        SIDE EFFECT: every OPEN clarification pointing at this task is flipped
        to `dropped` with a `resolvedAt`. Verified live. This is NOT reversed by
        `POST /me/tasks/undo/{token}`.

        `bulk_too_large` cannot fire here (a single id), but the code path is
        shared.
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDeleteResponse' }
          description: '`{"undoToken": "<TaskBulkOp id>"}` — nothing else.'
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  /me/tasks/{id}/subtasks:
    post:
      operationId: taskSubtaskAdd
      summary: Add a subtask
      tags: [tasks, subtasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Body `.strict()`: `{text: string}` — trimmed, min 1,
        max 240 (`MAX_SUBTASK_TEXT`). Verified live that the trim is applied
        before storage.

        Cap: 50 subtasks (`MAX_SUBTASKS`). At the cap the response is 400
        `subtask_limit` with the literal message
        "This task already has 50 subtasks — remove some before adding more."
        (em dash U+2014).

        RETURNS THE WHOLE PARENT TASK, not the subtask: `{"task": {...}}` with
        HTTP 201. RAW `toJSON()` — i18n present, no overlay. Each subtask in the
        array carries `text`, `done`, `createdAt` and `id` (its own `_id`
        renamed). Verified live.

        Implemented with `doc.save()`, so the whole document is REVALIDATED.
        A task in the invalid `kind: 'reminder'` + no-`dueAt` state (reachable
        via `PATCH {"dueAt": null}`) makes this route return 500
        `internal_error`. Verified live.
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskSubtaskCreateRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
          description: The WHOLE parent task, raw toJSON. Verified live.
        '400':
          description: '`invalid_body` / "Invalid subtask payload." or `subtask_limit`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '500':
          description: '`internal_error` — includes the reminder-without-dueAt revalidation failure. Verified live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }

  # ===========================================================================
  /me/tasks/{id}/subtasks/{subId}:
    patch:
      operationId: taskSubtaskUpdate
      summary: Update a subtask
      tags: [tasks, subtasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Body `.strict()` with
        `.refine(v => v.text !== undefined || v.done !== undefined)` — an empty
        `{}` is 400 `invalid_body` / "Invalid subtask update." with
        `details.formErrors = ["must include text or done"]`. Verified live.

        Either path parameter failing `Types.ObjectId.isValid` -> 404
        `task_not_found` (NOT `subtask_not_found`). A valid `subId` that is not
        in the array -> 404 `subtask_not_found` / "Subtask no longer exists."
        Verified live.

        RETURNS THE WHOLE PARENT TASK with HTTP 200, RAW `toJSON()`.
        Uses `doc.save()` — same revalidation caveat as POST subtasks.
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
        - { $ref: '#/components/parameters/TaskSubIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskSubtaskUpdateRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
          description: The WHOLE parent task, raw toJSON.
        '400':
          description: '`invalid_body` / "Invalid subtask update."'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404':
          description: '`task_not_found` or `subtask_not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '500': { $ref: '#/components/responses/TaskInternal' }

    delete:
      operationId: taskSubtaskDelete
      summary: Remove a subtask
      tags: [tasks, subtasks]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no body. Filters the subtask out by id; if the array
        length did not change -> 404 `subtask_not_found` / "Subtask no longer
        exists." Verified live (deleting the same subtask twice).
        RETURNS THE WHOLE PARENT TASK with HTTP 200, RAW `toJSON()`.
        Uses `doc.save()` — same revalidation caveat as POST subtasks.
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
        - { $ref: '#/components/parameters/TaskSubIdPath' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
          description: The WHOLE parent task, raw toJSON.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404':
          description: '`task_not_found` or `subtask_not_found`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  # /me/clarifications
  # ===========================================================================
  /me/clarifications:
    get:
      operationId: clarList
      summary: Open questions awaiting an answer
      tags: [clarifications]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. The ONLY query parameter read is `before`; there is NO
        schema, so unknown parameters are silently ignored (no 400 possible).

        `before` is `new Date(req.query.before)` when it is a string. An
        unparsable value (NaN) is IGNORED and the first page is returned —
        verified live with `?before=garbage` -> 200, full first page.
        When usable it becomes `createdAt: {$lt: before}`.

        Filter is `{userId, status: 'open', $or: [{deferredUntil missing},
        {deferredUntil <= now}]}` (`visibleOpen()`), sorted `{createdAt: -1}`,
        fetched with `limit(51)`.
        `hasMore = docs.length > 50`; the page is the first 50;
        `nextCursor = hasMore ? page[49].createdAt.toISOString() : null`.

        Item shape is the Clarification `toJSON`: `_id` -> `id`, `__v` dropped,
        and `sourceKey` DELETED (internal idempotency key, never sent).
        Embedded `draft` and `options[]` have `_id: false`, so they carry no id.
        Verified live against seeded rows.
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: |
            ISO-8601 createdAt of the last item seen. Unparsable values are
            ignored rather than rejected.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClarListResponse' }
          description: 'Verified live (empty): `{"clarifications":[],"hasMore":false,"nextCursor":null}`'
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  /me/clarifications/{id}/resolve:
    post:
      operationId: clarResolve
      summary: Answer a held question
      tags: [clarifications, ai]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. The `{type:'option'}` branch is FULLY DETERMINISTIC and
        works on the parity server; the `{type:'custom'}` branch is AI-backed
        and returns 503 there.

        ORDER OF CHECKS (verified live):
          1. requireAuth
          2. `Types.ObjectId.isValid(id)` -> 404 `clarification_not_found` /
             "That question is no longer here."
          3. `findOne({_id, userId})` -> same 404 when missing
          4. IDEMPOTENCY: if `doc.status !== 'open'`, respond 200 with
             `{clarification: <current doc>, task: null}` WITHOUT parsing the
             body. Verified live — resolving twice returns the resolved doc and
             `task: null`.
          5. `ResolveBodySchema.safeParse(req.body ?? {})` -> 400
             `invalid_answer` / "Invalid answer payload."
          6. Load the linked Task (`doc.taskId`, not deleted). IF IT IS GONE the
             question is moot: the clarification is closed out as `dropped` with
             a `resolvedAt` and the response is 200
             `{clarification, task: null}`. Verified live.
          7a. OPTION branch: `doc.options[index]`; a missing index -> 400
             `invalid_option` / "That answer is no longer available." Verified
             live. The option's `title`/`notes` and
             `(option.dueAt ?? draft.dueAt).toISOString()` become the patch.
          7b. CUSTOM branch: `isAiConfigured()` -> 503 `ai_not_configured` /
             "Typing your own answer needs AI configured. Pick one of the
             suggestions instead." Verified live. AI-enabled, it interprets the
             free text into title/domain/priority/notes/dueAt.
          8. The patch is applied through `runTool('updateTask')`; when the
             patch carries a `dueAt` the task is ALSO forced to
             `kind: 'reminder'` (a confirmed date turns a withheld reminder into
             a real one). Verified live: the returned task came back with
             `kind:"reminder"` and a generated `reminders[]` entry.
          9. The clarification is closed out `{status:'resolved', answer:
             <option.label | custom text>, resolvedAt}`.
         10. For the custom branch only, one AI message is recorded against the
             daily quota on a best-effort basis (never gated, never a 402).

        RESPONSE ECHOES THE IN-MEMORY DOCUMENT. `closeOut` does an atomic
        `updateOne` then `doc.set(patch)`, so the echoed `updatedAt` is the
        PRE-UPDATE value. Verified live: `deferredUntil`/`answer`/`resolvedAt`
        changed while `updatedAt` stayed at its original value.

        The returned `task` is `runTool`'s result — a RAW task object, no i18n
        overlay.
      parameters:
        - { $ref: '#/components/parameters/ClarIdPath' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClarResolveRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClarResolveResponse' }
          description: |
            `{clarification, task}`. `task` is null when the question was
            already closed or its task had been deleted.
        '400':
          description: '`invalid_answer` / "Invalid answer payload." or `invalid_option` / "That answer is no longer available." Both verified live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404': { $ref: '#/components/responses/ClarNotFound' }
        '503':
          description: |
            `{type:'custom'}` only. CURRENT PARITY TARGET. Verified live:
            {"error":{"code":"ai_not_configured","message":"Typing your own answer needs AI configured. Pick one of the suggestions instead."}}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  /me/clarifications/{id}/defer:
    post:
      operationId: clarDefer
      summary: Skip a question for 7 days
      tags: [clarifications]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no body. Sets `deferredUntil = now + 7 days`
        (`DEFER_MS = 7 * 24 * 60 * 60 * 1000`) ONLY when the current status is
        `open`; otherwise it is a pure read. Status is NOT changed — the row
        stays `open` and simply drops out of `visibleOpen()` until the date
        passes. Verified live.
        Always 200 with `{clarification: <echoed in-memory doc>}` (stale
        `updatedAt`, see /resolve).
      parameters:
        - { $ref: '#/components/parameters/ClarIdPath' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClarEnvelope' }
          description: The clarification with `deferredUntil` set.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404': { $ref: '#/components/responses/ClarNotFound' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  /me/clarifications/{id}/drop:
    post:
      operationId: clarDrop
      summary: Discard a question without creating anything
      tags: [clarifications]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no body. Sets `{status: 'dropped', resolvedAt: now}`
        ONLY when the current status is `open`; otherwise a pure read.
        Always 200 with `{clarification: ...}`. Verified live.
      parameters:
        - { $ref: '#/components/parameters/ClarIdPath' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClarEnvelope' }
          description: The dropped clarification.
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '404': { $ref: '#/components/responses/ClarNotFound' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  # /me/digest
  # ===========================================================================
  /me/digest:
    get:
      operationId: taskDigest
      summary: The dashboard's daily digest
      tags: [digest]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Query schema
        `z.object({tz: z.string().max(64).optional()}).strict()` — unknown
        parameter -> 400 `invalid_query` / "Invalid digest query." Verified live.

        WORKS WITHOUT AI. This endpoint is deliberately NOT gated on
        `isAiConfigured()`. The counts are code-computed and the headline is
        code-generated; the model, when configured, only upgrades the headline
        and theme labels asynchronously AFTER the response has been sent.
        Verified live on a server with no AI key: 200 with a complete payload
        and a computed headline.

        An INVALID `tz` does not fail the request: `safeTimezone` catches the
        Intl error, logs a warning, and falls back to UTC. Verified live with
        `?tz=Not/AZone` -> 200.

        CACHING is transparent to the client. One row per (userId, localDate)
        keyed by a sha256 fingerprint of
        `localDate | locale | <tasks n:maxUpdatedAt> | <clarifications n:maxUpdatedAt> | <scans n:maxUpdatedAt>`.
        A hit is served verbatim; a miss recomputes, returns immediately with
        the NEUTRAL headline, and refreshes the prose in the background.
        OBSERVABLE CONSEQUENCE: `generatedAt` is the instant the digest was
        COMPUTED, not the instant of this request, and it can be older than
        "now" on a cache hit. Verified live — three successive calls returned
        the identical `generatedAt`.

        NEUTRAL HEADLINE (exact algorithm, first match wins; `plural(n, one,
        many)` renders `"<n> <one|many>"`):
          dueToday > 0        -> "<n> matter[s] due today."
          completedToday > 0  -> "Nothing due today. <n> matter[s] closed."
          needsInput > 0      -> "Nothing due today. <n> question is|questions are waiting on you."
          openTotal === 0     -> "Nothing on today."
          otherwise           -> "Nothing due today."
        Verified live: "Nothing due today." on an empty day and
        "2 matters due today." with two matters due.

        COUNTS (`live` = not deleted && status in [open, snoozed]):
          dueToday       live && todayStart <= dueAt < tomorrowStart
                         (NOTE: unlike /me/tasks/counts `today`, the lower bound
                          here is todayStart, not `now`)
          completedToday {userId, status:'done', todayStart <= completedAt < tomorrowStart}
          openTotal      {userId, status:'open'} — the facet inherits the outer
                         `$match: {userId, deletedAt:{$exists:false}}`, so
                         trashed matters are excluded. NOTE this is every OPEN
                         matter ever, not a today-scoped number, and it does NOT
                         include `snoozed` ones.
          slipping       live && (rescheduleCount >= 3 || dueAt < todayStart - 14d)
          needsInput     visibleOpen clarifications, counted from the fingerprint
          scansAwaitingReview  ScannedDocument {status:'ready_for_review'} —
                         NOTE: unlike /me/tasks/counts this does NOT filter on
                         `reviewedAt`, so the digest can report MORE than the
                         counts endpoint

        estimatedMinutesToday: summed over at most 200 rows due today
        (`MAX_TODAY_ROWS`); a matter with no usable estimate contributes 0, and
        `max` is clamped to `>= min` per row. Verified live: two 15-30 minute
        matters -> `{"min":30,"max":60}`.

        busiestDay: heaviest day in [todayStart, todayStart+7d) grouped by
        `$dateToString` in the caller's zone (UTC when absent/invalid), sorted
        `{n: -1, _id: 1}` so ties break on the earlier date, `$limit: 1`.
        `null` when nothing is due in the window.

        duplicates: pool is every live matter with `dueAt < weekEnd` (overdue
        included), sorted `{dueAt: 1}`, capped at 120. Titles are binned on
        `trim().toLowerCase().replace(/\s+/g,' ')`; bins of size > 1 are sorted
        by size descending, the top 5 are kept, and each reports the FIRST
        member's original title, the count and every task id.
        Verified live with two "Call the vet" matters.

        themes: ALWAYS `[]` on a server with no AI key — the labels are the only
        model-written part and there is no carried-forward row to inherit from.
        Verified live.
      parameters:
        - name: tz
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
          description: IANA timezone. Invalid values fall back to UTC (no error).
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDigestResponse' }
          description: |
            Verified live:
            {"digest":{"localDate":"2026-08-09","generatedAt":"2026-08-09T17:49:57.451Z",
            "headline":"2 matters due today.","counts":{"dueToday":2,"completedToday":0,
            "openTotal":512,"slipping":0,"needsInput":2,"scansAwaitingReview":0},
            "estimatedMinutesToday":{"min":30,"max":60},"themes":[],
            "busiestDay":{"date":"2026-08-09","count":2},
            "duplicates":[{"title":"Call the vet","count":2,"taskIds":["...","..."]}]}}
        '400':
          description: '`invalid_query` / "Invalid digest query." Verified live.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  # /me/notifications
  # ===========================================================================
  /me/notifications:
    get:
      operationId: taskNotificationsList
      summary: In-app notification feed and unread count
      tags: [notifications]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no query schema (parameters ignored, no pagination).
        `Notification.find({userId}).sort({createdAt: -1}).limit(50)` plus
        `countDocuments({userId, readAt: null})`.
        NOTE `readAt: null` matches documents where the field is absent OR
        explicitly null (Mongo null-equality), which is what makes the unread
        count work on rows that never set it.
        Items are the Notification `toJSON`: `_id` -> `id`, `__v` dropped.
        Verified live with a seeded row.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNotificationsResponse' }
          description: |
            Verified live:
            {"notifications":[{"userId":"...","kind":"reminder","title":"Passport due",
            "body":"tomorrow","taskId":"...","createdAt":"...","updatedAt":"...",
            "id":"..."}],"unreadCount":1}
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  /me/notifications/read:
    post:
      operationId: taskNotificationsMarkRead
      summary: Mark notifications read
      tags: [notifications]
      security:
        - bearerAuth: []
      description: |
        No rate limiter. Body parsed from `req.body ?? {}` with
        `z.object({ids: z.array(z.string()).max(100).optional()})`.

        THIS IS THE ONE ENDPOINT IN THE DOMAIN THAT USES `.parse()` INSTEAD OF
        `.safeParse()`. A schema failure therefore escapes as a raw ZodError and
        is rendered by errorHandler in the OTHER 400 shape:
        `{"error":{"code":"validation_error","message":"Request validation
        failed","details":[{"path":"ids.0","message":"Expected string, received
        number"}]}}` — `details` is an ARRAY here, not the
        formErrors/fieldErrors object. Verified live with `{"ids":[1,2]}`.

        The schema is NOT `.strict()`: unknown keys are accepted and ignored
        (verified live with `{"zz":1}` -> 200).

        Behaviour: `{userId, readAt: null}` is the base filter; when `ids` is a
        NON-EMPTY array it is narrowed by `_id: {$in: ids.filter(isValidObjectId)}`
        (invalid ids are silently dropped, which can make the `$in` empty and
        the update a no-op). An omitted or EMPTY `ids` array marks ALL unread
        notifications read. Sets `readAt = new Date()`.
        Response is `{"ok": true, "unreadCount": <recount>}`. Verified live.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskNotificationsReadRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskNotificationsReadResponse' }
          description: '`{"ok":true,"unreadCount":0}`. Verified live.'
        '400':
          description: |
            `validation_error` / "Request validation failed" — the ZodError
            envelope, NOT the `invalid_body` envelope. Verified live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskZodErrorEnvelope' }
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

  # ===========================================================================
  # /me/reminders
  # ===========================================================================
  /me/reminders/upcoming:
    get:
      operationId: taskRemindersUpcoming
      summary: Reminders the device should schedule locally
      tags: [reminders]
      security:
        - bearerAuth: []
      description: |
        No rate limiter, no query schema (parameters ignored).

        Horizon 30 days (`HORIZON_DAYS`), cap 60 entries (`MAX_REMINDERS`,
        applied TWICE: as a `.limit(60)` on the task query and again as a
        `.slice(0, 60)` on the flattened list).

        Task filter: `{userId, not deleted, status: {$in: ['open','snoozed']},
        reminders: {$elemMatch: {firedAt: null, at: {$gt: now, $lte: horizon}}}}`,
        sorted `{dueAt: 1}`. The per-entry filter is re-applied after
        flattening (`!r.firedAt && r.at > now && r.at <= horizon`), so a task
        that qualified on one reminder does not leak its other reminders.

        Final ordering is `a.at.localeCompare(b.at)` over the ISO strings —
        i.e. ascending by time, ACROSS tasks, replacing the `dueAt` sort.

        `id` is deterministic: `` `${taskId}:${reminder.at.getTime()}` `` (epoch
        milliseconds), so a re-sync replaces the same OS notification instead of
        stacking duplicates. `dueAt` is the PARENT TASK's dueAt, or `null`.
        Verified live with two seeded reminders.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskUpcomingRemindersResponse' }
          description: |
            Verified live:
            {"reminders":[{"id":"6a78bbfdaa461ae1dc64a10e:1786556848864",
            "taskId":"6a78bbfdaa461ae1dc64a10e","title":"Renew passport",
            "at":"2026-08-12T17:47:28.864Z","kind":"lead",
            "dueAt":"2026-09-14T09:00:00.000Z"}, ...]}
        '401': { $ref: '#/components/responses/TaskUnauthorized' }
        '500': { $ref: '#/components/responses/TaskInternal' }

# =============================================================================
components:

  # ---------------------------------------------------------------------------
  parameters:

    TaskIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: |
        Task id. Validated with `Types.ObjectId.isValid` before any query; a
        malformed value yields 404 `task_not_found`, never a 400.

    TaskSubIdPath:
      name: subId
      in: path
      required: true
      schema: { type: string }
      description: |
        Subtask id. A malformed value yields 404 `task_not_found` (not
        `subtask_not_found`); a well-formed but absent one yields
        `subtask_not_found`.

    ClarIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Clarification id. Malformed -> 404 `clarification_not_found`.

    TaskQ:
      name: q
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: |
        Free text over `title` and `notes` (case-insensitive, regex-escaped,
        canonical text only). Trimmed by zod before the length check.
        Empty string -> 400.

    TaskStatusCsv:
      name: status
      in: query
      required: false
      schema:
        type: string
        pattern: '^(open|done|snoozed)(,(open|done|snoozed))*$'
      description: |
        Comma-separated subset of `open,done,snoozed`. Parts are trimmed and
        empty parts dropped. An unknown member fails the WHOLE request with
        `expected one of open|done|snoozed, got "<part>"`. Zero surviving parts
        -> "must not be empty".

    TaskDomainCsv:
      name: domain
      in: query
      required: false
      schema:
        type: string
        pattern: '^(health|home|car|finance|family|pets)(,(health|home|car|finance|family|pets))*$'
      description: Comma-separated subset of `health,home,car,finance,family,pets`. Same CSV rules as `status`.

    TaskPriorityCsv:
      name: priority
      in: query
      required: false
      schema:
        type: string
        pattern: '^(low|normal|high|urgent)(,(low|normal|high|urgent))*$'
      description: Comma-separated subset of `low,normal,high,urgent`. Same CSV rules as `status`.

    TaskKindCsv:
      name: kind
      in: query
      required: false
      schema:
        type: string
        pattern: '^(reminder|list)(,(reminder|list))*$'
      description: Comma-separated subset of `reminder,list`. Same CSV rules as `status`.

    TaskTagCsv:
      name: tag
      in: query
      required: false
      schema: { type: string, maxLength: 400 }
      description: |
        Comma-separated raw tags, OR-ed. Each part is normalized (lowercase,
        whitespace->'-', strip non `[a-z0-9-]`, collapse '-', trim '-', cap 32
        chars); parts that normalize to nothing are dropped. If NOTHING
        survives, no tag filter is applied and the request still succeeds — an
        empty string is a 200, not a 400.

    TaskDueBefore:
      name: dueBefore
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: '`dueAt <= value`. Must satisfy zod `.datetime()` (ISO-8601 with a timezone); `2026-09-01` alone is a 400 "Invalid datetime".'

    TaskDueAfter:
      name: dueAfter
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: '`dueAt >= value`. Same ISO-8601 requirement.'

    TaskCreatedBefore:
      name: createdBefore
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: '`createdAt <= value`.'

    TaskCreatedAfter:
      name: createdAfter
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: '`createdAt >= value`.'

    TaskCompletedBefore:
      name: completedBefore
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: '`completedAt <= value`.'

    TaskCompletedAfter:
      name: completedAfter
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: '`completedAt >= value`.'

    TaskOverdue:
      name: overdue
      in: query
      required: false
      schema: { type: string, enum: ['true', 'false'] }
      description: |
        ONLY the literal strings `true` / `false` are accepted (a boolean JSON
        value is also accepted by the schema but a query string can never carry
        one). Anything else -> 400 "Invalid input". `false` is parsed and then
        has no effect. `true` sets `dueAt < min(dueBefore, now)` and, when
        `status` was not supplied, restricts to `open`/`snoozed`.

    TaskUndated:
      name: undated
      in: query
      required: false
      schema: { type: string, enum: ['true', 'false'] }
      description: '`true` sets `dueAt: {$exists: false}` and DISCARDS every other dueAt clause (including `overdue`).'

    TaskUntagged:
      name: untagged
      in: query
      required: false
      schema: { type: string, enum: ['true', 'false'] }
      description: '`true` sets `tags: {$size: 0}`, OVERWRITING any `tag` filter.'

    TaskSortParam:
      name: sort
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskSort'
      description: 'Defaults to `due-asc` when ABSENT. An empty string is a 400 (the default does not apply to `""`).'

    TaskLimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: |
        `z.coerce.number().int().min(1).max(200).default(50)`. Coercion happens
        first: `""` -> 0 -> "greater than or equal to 1"; `abc` -> NaN ->
        "Expected number, received nan"; `2.5` -> "Expected integer, received
        float".

    TaskCursorParam:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 64 }
      description: |
        Opaque page token: base64url (NO padding) of the decimal offset.
        `Buffer.from(String(offset),'utf8').toString('base64url')`.
        Decoding is forgiving — anything that does not parse to a finite integer
        >= 0 becomes offset 0. Over 64 chars -> 400.

  # ---------------------------------------------------------------------------
  responses:

    TaskUnauthorized:
      description: |
        `missing_token` when the `Authorization` header is absent or does not
        start with `Bearer `; `invalid_token` when the JWT fails verification
        (including expiry). Both verified live.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
          examples:
            missing:
              value: { error: { code: missing_token, message: Missing access token } }
            invalid:
              value: { error: { code: invalid_token, message: Invalid or expired access token } }

    TaskNotFound:
      description: '`task_not_found` / "Task no longer exists." Covers malformed ids, unknown ids, other users'' ids and soft-deleted rows.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
          example:
            error: { code: task_not_found, message: Task no longer exists. }

    ClarNotFound:
      description: '`clarification_not_found` / "That question is no longer here."'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
          example:
            error: { code: clarification_not_found, message: That question is no longer here. }

    TaskRateLimited:
      description: |
        `rate_limited`. Accompanied by a `Retry-After` header in whole seconds.
        Verified live: `Retry-After: 60`.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
          description: Seconds until the oldest hit leaves the sliding window.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
          example:
            error:
              code: rate_limited
              message: "You are going a little fast — give it a moment and try again."

    TaskInternal:
      description: |
        `internal_error` / "Internal server error". Emitted for any unhandled
        throw, INCLUDING Mongoose ValidationError (which errorHandler does not
        special-case).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskErrorEnvelope' }
          example:
            error: { code: internal_error, message: Internal server error }

  # ---------------------------------------------------------------------------
  schemas:

    # ---- Error envelopes ----------------------------------------------------

    TaskErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The universal envelope from src/middleware/errorHandler.ts.
        `details` is present ONLY when the AppError carried one.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              description: |
                For `safeParse` routes this is `zodError.flatten()`:
                `{formErrors: string[], fieldErrors: object}`.
                For `categorize_already_open` it is `{opId}`.
                For `quota_exceeded` it is `{kind, tier, limit, used, resetAt}`.
                For `translate_quota_exceeded` it is `{locale, limit, used, resetAt}`.

    TaskZodFlatten:
      type: object
      additionalProperties: false
      required: [formErrors, fieldErrors]
      description: '`zodError.flatten()` — the `details` payload of every `invalid_query` / `invalid_body` / `invalid_answer` error in this domain.'
      properties:
        formErrors:
          type: array
          items: { type: string }
          description: Errors not attributable to one field (unknown keys under `.strict()`, and `.refine()` failures).
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    TaskZodErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The SECOND 400 shape, produced only when a raw ZodError escapes to the
        error handler. In this domain that is POST /me/notifications/read alone.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { type: string, const: validation_error }
            message: { type: string, const: Request validation failed }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path: { type: string, description: '`issue.path.join(".")`' }
                  message: { type: string }

    # ---- Enums --------------------------------------------------------------

    TaskDomain:
      type: string
      enum: [health, home, car, finance, family, pets]
      description: 'src/models/User.ts DOMAINS. Order is contractual — it appears verbatim in zod error messages.'

    TaskKind:
      type: string
      enum: [reminder, list]
      description: 'A `reminder` MUST carry a `dueAt` (enforced by a Mongoose pre-validate hook on create/save only). Schema default is `list`.'

    TaskStatus:
      type: string
      enum: [open, done, snoozed]

    TaskPriority:
      type: string
      enum: [low, normal, high, urgent]

    TaskSort:
      type: string
      enum: [due-asc, due-desc, created-desc, created-asc, priority-desc, title-asc]
      default: due-asc

    TaskEstimateSource:
      type: string
      enum: [ai, user]
      description: '`user` is authoritative forever; no AI pass may overwrite it.'

    TaskConfidence:
      type: string
      enum: [high, medium, low]

    TaskExternalSource:
      type: string
      enum: [google_calendar, google_tasks, apple_calendar, apple_reminders, ics_feed, email_forward]

    TaskTimePrecision:
      type: string
      enum: [exact, dateOnly, floating]

    TaskReminderKind:
      type: string
      enum: [lead, due, ai]
      description: 'Schema default is `due`.'

    TaskAiLocale:
      type: string
      enum: [en, ar]
      description: 'Resolved from the primary subtag; unknown or absent -> `en`.'

    TaskBulkActionName:
      type: string
      enum: [delete, complete, snooze, setDomain, addTags]

    ClarStatus:
      type: string
      enum: [open, resolved, dropped]

    ClarKind:
      type: string
      enum: [date, detail, choice]
      description: 'Schema default is `date`.'

    ClarCost:
      type: string
      enum: [low, high]
      description: 'Schema default is `high`.'

    TaskNotificationKind:
      type: string
      enum: [reminder, uncertainty, document_scan]

    # ---- The Task as it appears on the wire ---------------------------------

    TaskEstimate:
      type: object
      additionalProperties: false
      required: [minMinutes, maxMinutes, source]
      description: |
        Always snapped onto the bucket ladder
        [5,10,15,30,45,60,90,120,180,240]. Both bounds are members of that set
        and `maxMinutes >= minMinutes`. `_id: false` — no id is emitted.
      properties:
        minMinutes: { type: integer, enum: [5, 10, 15, 30, 45, 60, 90, 120, 180, 240] }
        maxMinutes: { type: integer, enum: [5, 10, 15, 30, 45, 60, 90, 120, 180, 240] }
        source: { $ref: '#/components/schemas/TaskEstimateSource' }

    TaskSubtask:
      type: object
      additionalProperties: false
      required: [text, done, id]
      description: |
        Serialized with its own `toIdJSON` transform: `_id` -> `id`, `__v`
        dropped. `createdAt` is stamped (`timestamps: {createdAt: true,
        updatedAt: false}`) so there is NO `updatedAt`. No `priorityRank`.
      properties:
        text: { type: string, maxLength: 240 }
        done: { type: boolean, default: false }
        createdAt: { type: string, format: date-time }
        id: { type: string, description: 24-char hex ObjectId. }

    TaskReminderEntry:
      type: object
      additionalProperties: false
      required: [at]
      description: '`_id: false` — no id is emitted. `firedAt` is absent until the reminder fires.'
      properties:
        at: { type: string, format: date-time }
        firedAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/TaskReminderKind' }

    TaskMatter:
      type: object
      additionalProperties: false
      required: [userId, title, domain, kind, status, priority, subtasks, tags, reminders, rescheduleCount, createdAt, updatedAt, id, priorityRank]
      description: |
        A Task AFTER `toJSON()`. Absent optional fields are OMITTED (never
        null). `_id` is gone (renamed `id`), `__v` is gone, `priorityRank` is
        added. `i18n` is present on every endpoint EXCEPT GET /me/tasks and
        GET /me/tasks/{id}, where it is always stripped.
      properties:
        id:
          type: string
          description: 24-char hex. Renamed from `_id`.
        userId:
          type: string
          description: 24-char hex. Emitted — the reference server does not hide it.
        title: { type: string, maxLength: 240 }
        domain: { $ref: '#/components/schemas/TaskDomain' }
        kind: { $ref: '#/components/schemas/TaskKind' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        priorityRank:
          type: integer
          enum: [0, 1, 2, 3]
          description: |
            DERIVED, not stored. urgent=3, high=2, normal=1, low=0; an
            unrecognised priority falls back to 1.
        subtasks:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskSubtask' }
        tags:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 32 }
        dueAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }
        sourceLocale:
          type: string
          description: |
            BCP 47 tag the canonical text is written in. NOT set by REST
            creation — absent on tasks created via POST /me/tasks.
        i18n:
          type: object
          description: |
            Read-only presentation copies keyed by locale:
            `{<locale>: {title?, notes?, subtasks?: {<subtaskId>: string}, at?}}`.
            STRIPPED on GET /me/tasks and GET /me/tasks/{id}; PRESENT everywhere
            else.
          additionalProperties:
            type: object
            properties:
              title: { type: string }
              notes: { type: string }
              subtasks:
                type: object
                additionalProperties: { type: string }
              at: { type: string, format: date-time }
        estimate: { $ref: '#/components/schemas/TaskEstimate' }
        completedAt: { type: string, format: date-time }
        snoozedUntil: { type: string, format: date-time }
        reminders:
          type: array
          items: { $ref: '#/components/schemas/TaskReminderEntry' }
        deletedAt:
          type: string
          format: date-time
          description: Present only on rows returned by GET /me/tasks/trash.
        rescheduleCount: { type: integer, minimum: 0, default: 0 }
        sourceVoiceNoteId: { type: string }
        sourceDocumentId: { type: string }
        sourceTaskKey: { type: string }
        externalSource: { $ref: '#/components/schemas/TaskExternalSource' }
        externalId: { type: string }
        timePrecision: { $ref: '#/components/schemas/TaskTimePrecision' }
        confidence: { $ref: '#/components/schemas/TaskConfidence' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskEnvelope:
      type: object
      additionalProperties: false
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/TaskMatter' }

    # ---- List ---------------------------------------------------------------

    TaskListResponse:
      type: object
      additionalProperties: false
      required: [tasks, total, nextCursor]
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/TaskMatter' }
          description: The page. i18n overlay applied, `i18n` stripped.
        total:
          type: integer
          minimum: 0
          description: Count of ALL matching rows, not just the page.
        nextCursor:
          type: [string, 'null']
          maxLength: 64
          description: base64url offset of the next page, or null when exhausted.

    TaskCounts:
      type: object
      additionalProperties: false
      required: [overdue, today, tomorrow, thisWeek, later, undated, open, done, trashed, slipping, completedToday, needsInput, scansAwaitingReview, byDomain, byPriority]
      properties:
        overdue: { type: integer, minimum: 0 }
        today: { type: integer, minimum: 0 }
        tomorrow: { type: integer, minimum: 0 }
        thisWeek: { type: integer, minimum: 0 }
        later: { type: integer, minimum: 0 }
        undated: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        trashed: { type: integer, minimum: 0 }
        slipping: { type: integer, minimum: 0 }
        completedToday: { type: integer, minimum: 0 }
        needsInput: { type: integer, minimum: 0 }
        scansAwaitingReview: { type: integer, minimum: 0 }
        byDomain:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
          description: 'Sparse — a domain with zero live matters is ABSENT, not 0.'
        byPriority:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
          description: 'Sparse — a priority with zero live matters is ABSENT, not 0.'

    TaskCountsResponse:
      type: object
      additionalProperties: false
      required: [counts]
      properties:
        counts: { $ref: '#/components/schemas/TaskCounts' }

    TaskTagsResponse:
      type: object
      additionalProperties: false
      required: [tags]
      properties:
        tags:
          type: array
          items: { type: string }
          description: Lexicographically ascending (JS default sort).

    TaskTrashResponse:
      type: object
      additionalProperties: false
      required: [tasks]
      properties:
        tasks:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/TaskMatter' }
          description: 'Raw toJSON, `deletedAt` present, newest-deleted first.'

    TaskPurgeResponse:
      type: object
      additionalProperties: false
      required: [purged]
      properties:
        purged: { type: integer, minimum: 0 }

    TaskDeleteResponse:
      type: object
      additionalProperties: false
      required: [undoToken]
      properties:
        undoToken:
          type: string
          description: |
            TaskBulkOp id. Never null on this route — `affected === 0` becomes a
            404 instead.

    TaskUndoResponse:
      type: object
      additionalProperties: false
      required: [restored]
      properties:
        restored:
          type: integer
          minimum: 0
          description: '`op.entries.length`, or 0 when the op was not in `applied` status.'

    # ---- Requests -----------------------------------------------------------

    TaskCreateRequest:
      type: object
      additionalProperties: false
      required: [title, domain]
      description: '`CreateTaskSchema`, `.strict()`. Any unknown key is a 400.'
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
          description: Trimmed by zod BEFORE the min/max check.
        domain: { $ref: '#/components/schemas/TaskDomain' }
        kind:
          $ref: '#/components/schemas/TaskKind'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
          description: |
            Up to 20 raw strings (MAX_TAGS * 2). Normalized, de-duplicated in
            order, empties dropped, then TRUNCATED to the first 10 survivors —
            extras are dropped SILENTLY, not rejected.
        dueAt:
          type: string
          format: date-time
          description: 'Must satisfy zod `.datetime()`. Presence flips the default `kind` to `reminder`.'
        notes: { type: string, maxLength: 2000 }
        estimate:
          type: object
          additionalProperties: false
          required: [minMinutes, maxMinutes]
          description: |
            `.strict()`. Both bounds are integers in 1..1440. They are then
            snapped onto the bucket ladder, re-sorted so max >= min, and stamped
            `source: 'user'`.
          properties:
            minMinutes: { type: integer, minimum: 1, maximum: 1440 }
            maxMinutes: { type: integer, minimum: 1, maximum: 1440 }
        sourceVoiceNoteId:
          type: string
          description: Must be a valid ObjectId (`invalid_object_id` otherwise).

    TaskUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        `UpdateTaskSchema`, `.strict()`. EVERY key is optional. An explicit
        `null` on a NULLABLE key CLEARS the field (`$unset`); an omitted key
        leaves it alone. `{}` is valid and touches only `updatedAt`.
      properties:
        title: { type: string, minLength: 1, maxLength: 240, description: 'NOT nullable.' }
        domain: { $ref: '#/components/schemas/TaskDomain' }
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        tags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
          description: 'NOT nullable. Same normalization/truncation as create.'
        dueAt:
          type: [string, 'null']
          format: date-time
          description: 'NULLABLE — `null` clears it. A strictly later value increments `rescheduleCount`.'
        notes:
          type: [string, 'null']
          maxLength: 2000
          description: 'NULLABLE — `null` clears it.'
        estimate:
          description: |
            NULLABLE — `null` clears the estimate back to "unknown". Otherwise
            the same strict object as on create.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [minMinutes, maxMinutes]
              properties:
                minMinutes: { type: integer, minimum: 1, maximum: 1440 }
                maxMinutes: { type: integer, minimum: 1, maximum: 1440 }
        snoozedUntil:
          type: [string, 'null']
          format: date-time
          description: 'NULLABLE — `null` clears it.'

    TaskSubtaskCreateRequest:
      type: object
      additionalProperties: false
      required: [text]
      description: '`.strict()`.'
      properties:
        text: { type: string, minLength: 1, maxLength: 240, description: Trimmed before validation and before storage. }

    TaskSubtaskUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        `.strict()` with `.refine(text !== undefined || done !== undefined)`.
        `{}` -> 400 with `formErrors: ["must include text or done"]`.
      properties:
        text: { type: string, minLength: 1, maxLength: 240 }
        done: { type: boolean }

    # ---- Bulk ---------------------------------------------------------------

    TaskFilterObject:
      type: object
      description: |
        `TaskFilterSchema` as a JSON BODY (used inside bulk/categorize targets).
        NOT `.strict()` here — unknown keys are stripped. Same 14 filters as the
        list query, with the same coercions: dates must be ISO-8601 strings;
        `status`/`domain`/`priority`/`kind` are COMMA-SEPARATED STRINGS (not
        arrays) even in JSON; booleans accept a real `true`/`false` or the
        strings `"true"`/`"false"`.
      properties:
        q: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string }
        domain: { type: string }
        priority: { type: string }
        kind: { type: string }
        tag: { type: string, maxLength: 400 }
        dueBefore: { type: string, format: date-time }
        dueAfter: { type: string, format: date-time }
        createdBefore: { type: string, format: date-time }
        createdAfter: { type: string, format: date-time }
        completedBefore: { type: string, format: date-time }
        completedAfter: { type: string, format: date-time }
        overdue: { type: [boolean, string] }
        undated: { type: [boolean, string] }
        untagged: { type: [boolean, string] }

    TaskBulkTarget:
      type: object
      description: |
        `BulkTargetSchema`. Exactly ONE of `ids` / `filter`; violating that
        yields `formErrors: ["provide exactly one of ids or filter"]`.
        Not `.strict()`.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, description: Must be a valid ObjectId. }
        filter: { $ref: '#/components/schemas/TaskFilterObject' }

    TaskBulkAction:
      description: |
        `BulkActionSchema` — a zod discriminated union on `action`. An unknown
        action yields
        `fieldErrors.action = ["Invalid discriminator value. Expected 'delete' | 'complete' | 'snooze' | 'setDomain' | 'addTags'"]`.
      oneOf:
        - type: object
          required: [action]
          properties:
            action: { type: string, const: delete }
        - type: object
          required: [action]
          properties:
            action: { type: string, const: complete }
        - type: object
          required: [action, until]
          properties:
            action: { type: string, const: snooze }
            until: { type: string, format: date-time, description: 'REQUIRED. zod `.datetime()`.' }
        - type: object
          required: [action, domain]
          properties:
            action: { type: string, const: setDomain }
            domain: { $ref: '#/components/schemas/TaskDomain' }
        - type: object
          required: [action, tags]
          properties:
            action: { type: string, const: addTags }
            tags:
              type: array
              minItems: 1
              maxItems: 10
              items: { type: string, maxLength: 64 }

    TaskBulkRequest:
      description: '`z.intersection(BulkTargetSchema, BulkActionSchema)` — target fields and action fields flattened into ONE object.'
      allOf:
        - { $ref: '#/components/schemas/TaskBulkTarget' }
        - { $ref: '#/components/schemas/TaskBulkAction' }

    TaskBulkApplyRequest:
      description: |
        Same as TaskBulkRequest plus an optional top-level `label` that is read
        straight off `req.body` (outside zod) and truncated to 240 chars. It is
        stored on the TaskBulkOp and never echoed.
      allOf:
        - { $ref: '#/components/schemas/TaskBulkRequest' }
        - type: object
          properties:
            label: { type: string, description: 'Truncated with `.slice(0, 240)`. Non-string values are ignored.' }

    TaskBulkWarnings:
      type: object
      additionalProperties: false
      required: [fromDocuments, remindersFired, truncated]
      properties:
        fromDocuments:
          type: integer
          minimum: 0
          description: Resolved tasks carrying a `sourceDocumentId`.
        remindersFired:
          type: integer
          minimum: 0
          description: Resolved tasks with at least one `reminders[].firedAt`.
        truncated:
          type: boolean
          description: 'True when more than 500 matched (the resolver reads 501 to detect it).'

    TaskBulkPreviewResponse:
      type: object
      additionalProperties: false
      required: [count, warnings, sample]
      properties:
        count:
          type: integer
          minimum: 0
          maximum: 501
          description: 'Resolved target count. Saturates at 501 on the filter path.'
        warnings: { $ref: '#/components/schemas/TaskBulkWarnings' }
        sample:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskMatter' }
          description: 'First 50 resolved tasks, RAW toJSON (i18n present, no overlay).'

    TaskBulkResult:
      type: object
      additionalProperties: false
      required: [affected, undoToken, warnings]
      properties:
        affected:
          type: integer
          minimum: 0
          description: Number of tasks that produced a real change (no-ops are excluded).
        undoToken:
          type: [string, 'null']
          description: 'TaskBulkOp id, or null when `affected === 0` (no record is written).'
        warnings: { $ref: '#/components/schemas/TaskBulkWarnings' }

    # ---- Categorize ---------------------------------------------------------

    TaskProposedChange:
      type: object
      additionalProperties: false
      required: [taskId, title, fromDomain, toDomain, addedTags, confidence, reason]
      properties:
        taskId: { type: string }
        title: { type: string, description: 'Joined from the LIVE task at read time, not denormalised.' }
        fromDomain: { $ref: '#/components/schemas/TaskDomain' }
        toDomain: { $ref: '#/components/schemas/TaskDomain' }
        addedTags:
          type: array
          items: { type: string }
          description: 'Tags this would ADD. Existing tags are never removed.'
        confidence: { $ref: '#/components/schemas/TaskConfidence' }
        reason: { type: string, maxLength: 240, description: 'Empty string when the op entry carried none.' }

    TaskPendingProposal:
      type: object
      additionalProperties: false
      required: [opId, changes, createdAt]
      properties:
        opId: { type: string }
        changes:
          type: array
          items: { $ref: '#/components/schemas/TaskProposedChange' }
          description: 'Entries whose task has since been deleted or trashed are DROPPED.'
        createdAt: { type: string, format: date-time }

    TaskCategorizePendingResponse:
      type: object
      additionalProperties: false
      required: [proposal]
      properties:
        proposal:
          oneOf:
            - { $ref: '#/components/schemas/TaskPendingProposal' }
            - type: 'null'

    TaskProposalResult:
      type: object
      additionalProperties: false
      required: [opId, changes, unchanged]
      description: 'POST /me/tasks/categorize success shape (AI-enabled only).'
      properties:
        opId:
          type: string
          description: 'EMPTY STRING when nothing was proposed — no op record is written in that case.'
        changes:
          type: array
          items: { $ref: '#/components/schemas/TaskProposedChange' }
        unchanged:
          type: integer
          minimum: 0
          description: Matters looked at but left alone.

    TaskCategorizeApplyRequest:
      type: object
      additionalProperties: false
      required: [taskIds]
      description: '`.strict()`. `taskIds` is required but may be empty (which DISCARDS the proposal).'
      properties:
        taskIds:
          type: array
          maxItems: 80
          items: { type: string, description: Must be a valid ObjectId. }

    TaskCategorizeApplyResponse:
      type: object
      additionalProperties: false
      required: [applied, undoToken]
      properties:
        applied: { type: integer, minimum: 0 }
        undoToken:
          type: [string, 'null']
          description: 'The proposal id itself, or null when nothing was kept.'

    # ---- AI: search / summarize / estimate / translate ----------------------

    TaskSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      description: '`.strict()`.'
      properties:
        query: { type: string, minLength: 1, maxLength: 400, description: Trimmed before validation. }
        timezone: { type: string, maxLength: 64 }

    TaskSearchMatch:
      type: object
      additionalProperties: false
      required: [task, reason]
      properties:
        task:
          allOf: [{ $ref: '#/components/schemas/TaskMatter' }]
          description: 'RAW toJSON — `i18n` present, no overlay.'
        reason: { type: string }

    TaskSearchResponse:
      type: object
      additionalProperties: false
      required: [answer, truncated, matches]
      description: AI-enabled only. Never produced by the current parity server.
      properties:
        answer: { type: string, description: 'One sentence. `"You have no matters yet."` when the pool is empty.' }
        truncated: { type: boolean, description: 'True when the candidate pool exceeded 300 matters.' }
        matches:
          type: array
          items: { $ref: '#/components/schemas/TaskSearchMatch' }

    TaskSummarizeRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      description: '`.strict()` plus `.refine(to > from)` — "to must be after from" lands in `formErrors`.'
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string, maxLength: 64 }

    TaskSummaryTheme:
      type: object
      additionalProperties: false
      required: [label, count, taskIds, examples]
      properties:
        label: { type: string }
        count: { type: integer, minimum: 0 }
        taskIds: { type: array, items: { type: string } }
        examples: { type: array, items: { type: string } }

    TaskSummarySlip:
      type: object
      additionalProperties: false
      required: [taskId, title, reason]
      properties:
        taskId: { type: string }
        title: { type: string }
        reason: { type: string }

    TaskSummaryDuplicate:
      type: object
      additionalProperties: false
      required: [title, count, taskIds]
      properties:
        title: { type: string }
        count: { type: integer, minimum: 2 }
        taskIds: { type: array, items: { type: string } }

    TaskSummary:
      type: object
      additionalProperties: false
      required: [range, counts, themes, slipping, duplicates, unplannedCompleted, busiestDay, headline, question]
      description: AI-enabled only. Every number is computed in code.
      properties:
        range:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        counts:
          type: object
          additionalProperties: false
          required: [dueInRange, completedInRange, createdInRange, completedPrevious, stillOpen, overdue]
          properties:
            dueInRange: { type: integer, minimum: 0 }
            completedInRange: { type: integer, minimum: 0 }
            createdInRange: { type: integer, minimum: 0 }
            completedPrevious:
              type: integer
              minimum: 0
              description: Same-length window immediately before the range.
            stillOpen: { type: integer, minimum: 0 }
            overdue: { type: integer, minimum: 0 }
        themes:
          type: array
          items: { $ref: '#/components/schemas/TaskSummaryTheme' }
        slipping:
          type: array
          items: { $ref: '#/components/schemas/TaskSummarySlip' }
        duplicates:
          type: array
          items: { $ref: '#/components/schemas/TaskSummaryDuplicate' }
        unplannedCompleted:
          type: array
          description: Completed in range with no due date.
          items:
            type: object
            additionalProperties: false
            required: [taskId, title]
            properties:
              taskId: { type: string }
              title: { type: string }
        busiestDay:
          oneOf:
            - type: object
              additionalProperties: false
              required: [date, count]
              properties:
                date: { type: string, description: '`YYYY-MM-DD` in the caller''s zone.' }
                count: { type: integer, minimum: 1 }
            - type: 'null'
        headline: { type: string }
        question:
          oneOf:
            - type: object
              additionalProperties: false
              required: [text, taskId]
              properties:
                text: { type: string }
                taskId: { type: [string, 'null'] }
            - type: 'null'

    TaskSummaryResponse:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: { $ref: '#/components/schemas/TaskSummary' }

    TaskEstimateBacklogRequest:
      type: object
      additionalProperties: false
      description: '`.strict()`. Absent body is treated as `{}`.'
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 40
          description: '`MAX_BACKLOG_BATCH` is 40. Defaults (inside the service) to 40 and is clamped into 1..40.'

    TaskEstimateBacklogResponse:
      type: object
      additionalProperties: false
      required: [estimated, remaining]
      description: 'AI-enabled only. The service never throws on model failure — it reports `estimated: 0`.'
      properties:
        estimated: { type: integer, minimum: 0 }
        remaining:
          type: integer
          minimum: 0
          description: Un-estimated live matters still outstanding after this batch.

    TaskTranslateRequest:
      type: object
      required: [locale]
      description: 'NOT `.strict()` — unknown keys are accepted and stripped. Absent body is treated as `{}` (which then fails on the required `locale`).'
      properties:
        locale: { $ref: '#/components/schemas/TaskAiLocale' }
        ids:
          type: array
          maxItems: 150
          items: { type: string }
          description: 'Plain strings — NOT validated as ObjectIds.'
        preset:
          type: string
          enum: [thisWeek, thisMonth, all]

    TaskTranslateResponse:
      type: object
      additionalProperties: false
      required: [translated, skipped, failed]
      description: AI-enabled only.
      properties:
        translated: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0, description: In the selection but already readable in the target language. }
        failed: { type: integer, minimum: 0, description: Sent to the model and lost to a failed or unusable batch. }

    TaskTranslateQuota:
      type: object
      additionalProperties: false
      required: [locale, limit, used, remaining, resetAt]
      properties:
        locale: { $ref: '#/components/schemas/TaskAiLocale' }
        limit: { type: integer, const: 1, description: '`TRANSLATE_RUNS_PER_MONTH` — 1 for every tier.' }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0, description: '`max(0, limit - used)`.' }
        resetAt: { type: string, format: date-time, description: Midnight UTC on the 1st of the following month. }

    TaskTranslateQuotaResponse:
      type: object
      additionalProperties: false
      required: [quota, counts, max]
      properties:
        quota: { $ref: '#/components/schemas/TaskTranslateQuota' }
        counts:
          type: object
          additionalProperties: false
          required: [thisWeek, thisMonth, all]
          properties:
            thisWeek: { type: integer, minimum: 0 }
            thisMonth: { type: integer, minimum: 0 }
            all: { type: integer, minimum: 0 }
        max: { type: integer, const: 150, description: '`MAX_TRANSLATE_TARGETS`.' }

    # ---- Digest -------------------------------------------------------------

    TaskDigestCounts:
      type: object
      additionalProperties: false
      required: [dueToday, completedToday, openTotal, slipping, needsInput, scansAwaitingReview]
      properties:
        dueToday: { type: integer, minimum: 0 }
        completedToday: { type: integer, minimum: 0 }
        openTotal:
          type: integer
          minimum: 0
          description: 'Every live matter with status `open` (snoozed excluded), not a today-scoped figure.'
        slipping: { type: integer, minimum: 0 }
        needsInput: { type: integer, minimum: 0 }
        scansAwaitingReview:
          type: integer
          minimum: 0
          description: 'Counts every `ready_for_review` scan — unlike /me/tasks/counts it does NOT require `reviewedAt` to be absent.'

    TaskDigestTheme:
      type: object
      additionalProperties: false
      required: [label, count, taskIds]
      properties:
        label: { type: string }
        count: { type: integer, minimum: 1 }
        taskIds: { type: array, items: { type: string } }

    TaskDigestDuplicate:
      type: object
      additionalProperties: false
      required: [title, count, taskIds]
      properties:
        title: { type: string }
        count: { type: integer, minimum: 2 }
        taskIds: { type: array, items: { type: string } }

    TaskDigest:
      type: object
      additionalProperties: false
      required: [localDate, generatedAt, headline, counts, estimatedMinutesToday, themes, busiestDay, duplicates]
      properties:
        localDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: '`en-CA` formatted local date.' }
        generatedAt:
          type: string
          format: date-time
          description: 'When the digest was COMPUTED. On a cache hit this is older than the request.'
        headline: { type: string, description: 'Code-generated on this server. See the operation description for the exact algorithm.' }
        counts: { $ref: '#/components/schemas/TaskDigestCounts' }
        estimatedMinutesToday:
          type: object
          additionalProperties: false
          required: [min, max]
          properties:
            min: { type: integer, minimum: 0 }
            max: { type: integer, minimum: 0 }
        themes:
          type: array
          items: { $ref: '#/components/schemas/TaskDigestTheme' }
          description: 'ALWAYS `[]` while AI is unconfigured.'
        busiestDay:
          oneOf:
            - type: object
              additionalProperties: false
              required: [date, count]
              properties:
                date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
                count: { type: integer, minimum: 1 }
            - type: 'null'
        duplicates:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/TaskDigestDuplicate' }

    TaskDigestResponse:
      type: object
      additionalProperties: false
      required: [digest]
      properties:
        digest: { $ref: '#/components/schemas/TaskDigest' }

    # ---- Notifications ------------------------------------------------------

    TaskNotification:
      type: object
      additionalProperties: false
      required: [userId, kind, title, createdAt, updatedAt, id]
      description: 'Notification `toJSON`: `_id` -> `id`, `__v` dropped. Absent optionals are omitted.'
      properties:
        id: { type: string }
        userId: { type: string }
        kind: { $ref: '#/components/schemas/TaskNotificationKind' }
        title: { type: string }
        body: { type: string }
        taskId: { type: string }
        clarificationId: { type: string }
        documentId: { type: string }
        readAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskNotificationsResponse:
      type: object
      additionalProperties: false
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskNotification' }
          description: Newest first. Hard cap 50, no pagination.
        unreadCount: { type: integer, minimum: 0 }

    TaskNotificationsReadRequest:
      type: object
      description: 'NOT `.strict()`. Parsed with `.parse()`, so a failure produces the `validation_error` envelope.'
      properties:
        ids:
          type: array
          maxItems: 100
          items: { type: string }
          description: |
            Omitted or EMPTY marks all unread read. Entries that are not valid
            ObjectIds are silently filtered out.

    TaskNotificationsReadResponse:
      type: object
      additionalProperties: false
      required: [ok, unreadCount]
      properties:
        ok: { type: boolean, const: true }
        unreadCount: { type: integer, minimum: 0 }

    # ---- Reminders ----------------------------------------------------------

    TaskUpcomingReminder:
      type: object
      additionalProperties: false
      required: [id, taskId, title, at, kind, dueAt]
      properties:
        id: { type: string, description: '`<taskId>:<epochMillisOfReminder>` — deterministic, so a re-sync replaces rather than stacks.' }
        taskId: { type: string }
        title: { type: string, description: 'The task''s CANONICAL title — no i18n overlay.' }
        at: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/TaskReminderKind' }
        dueAt: { type: [string, 'null'], format: date-time, description: 'The parent task''s dueAt, or null.' }

    TaskUpcomingRemindersResponse:
      type: object
      additionalProperties: false
      required: [reminders]
      properties:
        reminders:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/TaskUpcomingReminder' }
          description: Ascending by `at` across all tasks.

    # ---- Clarifications -----------------------------------------------------

    ClarOption:
      type: object
      additionalProperties: false
      required: [label]
      description: '`_id: false` — no id is emitted. Absent optionals are omitted.'
      properties:
        label: { type: string }
        dueAt: { type: string, format: date-time }
        title: { type: string }
        notes: { type: string }

    ClarDraft:
      type: object
      additionalProperties: false
      required: [title, domain, priority, tags]
      description: 'The provisional task. `_id: false`.'
      properties:
        title: { type: string }
        domain: { $ref: '#/components/schemas/TaskDomain' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        notes: { type: string }
        tags: { type: array, items: { type: string } }
        dueAt: { type: string, format: date-time }

    ClarItem:
      type: object
      additionalProperties: false
      required: [userId, taskId, status, draft, question, kind, costOfWrong, options, createdAt, updatedAt, id]
      description: |
        Clarification `toJSON`: `_id` -> `id`, `__v` dropped, and `sourceKey`
        DELETED (internal idempotency key, never sent to the client).
        NOTE: on /resolve, /defer and /drop the echoed document is the
        IN-MEMORY copy after `doc.set(patch)`, so `updatedAt` is the
        pre-update value while the patched fields are current.
      properties:
        id: { type: string }
        userId: { type: string }
        taskId: { type: string, description: 'The REAL Task this question is about. Required on the model.' }
        status: { $ref: '#/components/schemas/ClarStatus' }
        draft: { $ref: '#/components/schemas/ClarDraft' }
        question: { type: string }
        kind: { $ref: '#/components/schemas/ClarKind' }
        costOfWrong: { $ref: '#/components/schemas/ClarCost' }
        options:
          type: array
          items: { $ref: '#/components/schemas/ClarOption' }
        sourceText: { type: string, description: 'What the user actually said, verbatim. Display only.' }
        deferredUntil: { type: string, format: date-time }
        answer: { type: string, description: 'The option label, or the custom text.' }
        resolvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClarListResponse:
      type: object
      additionalProperties: false
      required: [clarifications, hasMore, nextCursor]
      properties:
        clarifications:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ClarItem' }
        hasMore: { type: boolean }
        nextCursor:
          type: [string, 'null']
          format: date-time
          description: '`createdAt` of the last item on this page, or null.'

    ClarEnvelope:
      type: object
      additionalProperties: false
      required: [clarification]
      properties:
        clarification: { $ref: '#/components/schemas/ClarItem' }

    ClarResolveRequest:
      type: object
      additionalProperties: false
      required: [answer]
      description: |
        NOT `.strict()` at the top level. `answer` is a discriminated union on
        `type`. Parsed from `req.body ?? {}`, and ONLY after the
        already-closed short-circuit.
      properties:
        answer:
          oneOf:
            - type: object
              required: [type, index]
              properties:
                type: { type: string, const: option }
                index:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: |
                    Index into `options`. 0..3 by SCHEMA; an index inside that
                    range but past the end of the array is a 400
                    `invalid_option`, while 4+ is a 400 `invalid_answer`.
            - type: object
              required: [type, text]
              properties:
                type: { type: string, const: custom }
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: 'Trimmed. THIS BRANCH IS AI-BACKED — 503 on the parity server.'
        timezone: { type: string, minLength: 1, maxLength: 64 }

    ClarResolveResponse:
      type: object
      additionalProperties: false
      required: [clarification, task]
      properties:
        clarification: { $ref: '#/components/schemas/ClarItem' }
        task:
          oneOf:
            - { $ref: '#/components/schemas/TaskMatter' }
            - type: 'null'
          description: |
            The updated task from `runTool('updateTask')` — RAW, no i18n
            overlay. NULL when the question was already closed, or when its
            task had been deleted (in which case the question is closed out as
            `dropped`).
