name: framework
description: >-
  Framework-level behaviour that sits underneath every route: the health probe,
  Express' default HTML 404 (NOT the JSON envelope), and the two flavours of
  401. Costs no auth rate-limit budget, so it is the cheapest smoke test.
tags: [core, cheap]
user: none

steps:
  - name: health
    op: authHealth
    method: GET
    path: /health
    expect: { status: 200 }

  # DECLARED EXCEPTION — the only two statusOnly steps in the corpus.
  #
  # Express has no catch-all JSON 404 handler; finalhandler emits an HTML page.
  # We deliberately do NOT reproduce that body: it interpolates the request path
  # (`Cannot PUT /health`), which is attacker-controlled, so a naive port creates
  # reflected XSS on every unknown route of an API that also serves authenticated
  # JSON. Nothing parses a 404 body — the frontend branches on status — so the
  # status is the only difference a client can observe, and the .NET side now
  # matches it. Arbitration in docs/KERNEL.md §2.2.1 and docs/RESUME.md.
  #
  # What is still asserted: the status is 404, not 405. What is not: content-type
  # and body. A JSON error envelope here would be a DIFFERENT kind of wrong, and
  # is caught by MethodMismatchTests.the_404_body_is_not_the_json_error_envelope.
  - name: unknown-route-is-html-404
    frameworkProbe: true
    statusOnly: true
    method: GET
    path: /nope
    expect: { status: 404 }

  - name: unknown-method-on-known-path-is-html-404
    frameworkProbe: true
    statusOnly: true
    method: PUT
    path: /health
    expect: { status: 404 }

  - name: unauthenticated-is-missing-token
    op: taskList
    method: GET
    path: /me/tasks
    auth: false
    expect: { status: 401 }

  - name: garbage-bearer-is-invalid-token
    op: authMe
    method: GET
    path: /auth/me
    auth: 'Bearer not-a-real-token'
    expect: { status: 401 }

  - name: lowercase-bearer-is-missing-token
    op: authMe
    method: GET
    path: /auth/me
    auth: 'bearer not-a-real-token'
    expect: { status: 401 }
    # Only the exact literal "Bearer " prefix counts; anything else never
    # reaches token verification and reports missing_token.
